<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dokladoid – Fakturoid Edition Pro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f9;--card:#ffffff;--tx:#1d2432;--mu:#687387;--bd:#e2e6ee;
  --side:#1c2536;--side-hover:#263248;--sidetx:#c4cddb;
  --ac:#1976d2;--ac2:#125aa3;--acs:#e8f1fb;
  --green:#2e9e5b;--green2:#238249;--green-bg:#e6f6ec;
  --orange:#e67e22;--orange-bg:#fdf1e4;
  --red:#d9383a;--red-bg:#fde8e8;
  --sh:0 1px 3px rgba(16,24,40,.06),0 4px 12px rgba(16,24,40,.04);
  box-sizing:border-box;
}
:root[data-theme="dark"]{
  --bg:#0f131a;--card:#181e29;--tx:#e8edf5;--mu:#94a0b4;--bd:#283142;
  --side:#0b0e14;--side-hover:#171d2b;--sidetx:#b0bac9;
  --ac:#4b96eb;--ac2:#6baaf0;--acs:#1a2940;
  --green:#38b76c;--green2:#2c9c59;--green-bg:#143020;
  --orange:#f0933e;--orange-bg:#362411;
  --red:#ef5b5d;--red-bg:#381818;
  --sh:0 2px 8px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}

.app{display:flex;min-height:100vh}
aside{
  width:240px;flex:none;background:var(--side);color:var(--sidetx);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:100;
  transition:transform .25s ease;
}
.side-top{padding:18px 16px 12px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand{display:flex;align-items:center;justify-content:space-between;color:#fff;font-weight:700;font-size:18px;margin-bottom:12px}
.brand-l{display:flex;align-items:center;gap:9px}
.robot{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#2e9e5b,#1976d2);display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px}
.co-sel{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:8px;padding:8px 10px;font-weight:600;font-size:13px;cursor:pointer}
.co-sel option{color:#111;background:#fff}

.cta-wrap{padding:14px 16px 6px}
.btn-new-main{
  width:100%;background:var(--green);color:#fff;border:0;border-radius:8px;
  padding:11px 14px;font:inherit;font-weight:600;font-size:14.5px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 3px 10px rgba(46,158,91,.35);transition:background .15s;
}
.btn-new-main:hover{background:var(--green2)}

nav{padding:10px 10px;display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
nav button{
  display:flex;align-items:center;gap:11px;background:none;border:0;color:var(--sidetx);
  padding:10px 12px;border-radius:8px;font:inherit;font-weight:500;cursor:pointer;text-align:left;
  transition:background .12s,color .12s;
}
nav button:hover{background:var(--side-hover);color:#fff}
nav button.on{background:rgba(255,255,255,.12);color:#fff;font-weight:600;border-left:3px solid var(--green);padding-left:9px}
.ic{width:18px;height:18px;flex:none;opacity:.85}
nav button.on .ic{opacity:1;color:var(--green)}

.side-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;display:flex;flex-direction:column;gap:8px}
.sync-pill{display:flex;align-items:center;gap:6px;font-size:11.5px;padding:5px 8px;border-radius:6px;background:rgba(255,255,255,.06)}
.dot{width:8px;height:8px;border-radius:50%;background:#f59e0b}
.dot.ok{background:#22c55e}
.user-row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.user-sel{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:6px;padding:4px 7px;font-size:12px;flex:1}
.user-sel option{color:#111}
.icon-btn{background:rgba(255,255,255,.08);border:0;color:#fff;border-radius:6px;padding:5px 8px;cursor:pointer;font-size:12px}

.mob-bar{display:none;background:var(--side);color:#fff;padding:10px 14px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:90}
.burger{background:none;border:0;color:#fff;font-size:22px;cursor:pointer;padding:4px 8px;line-height:1}
.backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:95}
.backdrop.show{display:block}

.mainwrap{flex:1;min-width:0;display:flex;flex-direction:column}
main{max-width:1300px;width:100%;margin:0 auto;padding:24px 28px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
h2{margin:0 0 14px;font-size:17px;font-weight:700}

.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:20px;margin-bottom:16px;box-shadow:var(--sh)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}

select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:7px;padding:8px 10px;max-width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:4px;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.grid input,.grid select{width:100%}

button.b{background:var(--ac);color:#fff;border:0;border-radius:7px;padding:8px 15px;font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button.b:hover{background:var(--ac2)}
button.b.grn{background:var(--green)}
button.b.grn:hover{background:var(--green2)}
button.b:disabled{opacity:.5;cursor:default}
button.g{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:7px;padding:6px 11px;font:inherit;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px}
button.g:hover{background:var(--bg)}
button.g.dup{background:var(--acs);color:var(--ac);border-color:transparent;font-weight:600}
button.d{color:var(--red)}

.bd{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:6px;font-size:11.5px;font-weight:600;white-space:nowrap}
.bd.paid{background:var(--green-bg);color:var(--green)}
.bd.open{background:var(--acs);color:var(--ac)}
.bd.sent{background:var(--orange-bg);color:var(--orange)}
.bd.over{background:var(--red-bg);color:var(--red)}
.bd.draft{background:var(--bg);color:var(--mu);border:1px solid var(--bd)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px 18px;box-shadow:var(--sh);border-top:3px solid var(--bd)}
.kpi.k-grn{border-top-color:var(--green)}
.kpi.k-blu{border-top-color:var(--ac)}
.kpi.k-red{border-top-color:var(--red)}
.kpi.k-org{border-top-color:var(--orange)}
.kl{font-size:11.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.kv{font-size:23px;font-weight:700;margin-top:6px}
.ks{font-size:12px;color:var(--mu);margin-top:4px}

.bars{display:flex;gap:14px;align-items:flex-end;height:165px;padding-top:14px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.bv{width:100%;max-width:54px;background:linear-gradient(180deg,var(--ac),var(--ac2));border-radius:6px 6px 0 0;min-height:3px;transition:height .3s}
.bar span{font-size:12px;color:var(--mu)}

.w{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:11px;color:var(--mu);text-align:left;font-weight:600;padding:9px 8px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--bd)}
td{padding:10px 8px;border-bottom:1px solid var(--bd);vertical-align:middle}
tbody tr:hover{background:rgba(127,140,170,.04)}
.r{text-align:right;white-space:nowrap}
.mu{color:var(--mu);font-size:12.5px}
.clk{cursor:pointer}

/* Split Screen Fakturoid Editor */
.split-wrap{display:grid;grid-template-columns:1.08fr 0.92fr;gap:20px;align-items:start}
.preview-sticky{position:sticky;top:20px}

/* Template Designer Panel */
.tpl-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.tpl-btn{
  border:2px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;
  padding:8px 6px;font-size:11.5px;font-weight:600;cursor:pointer;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:4px;transition:all .15s;
}
.tpl-btn.on{border-color:var(--ac);background:var(--acs);color:var(--ac)}
.tpl-mini{width:100%;height:26px;border-radius:4px;border:1px solid rgba(0,0,0,.1);background:#fff;position:relative;overflow:hidden}
.customizer-box{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:12px;margin-top:10px}
.cust-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
.color-pick{display:flex;align-items:center;gap:6px}
.color-pick input[type="color"]{width:34px;height:32px;padding:2px;border-radius:6px;cursor:pointer}

/* ==========================================================================
   4 ÚPLNĚ ODLIŠNÉ ARCHITEKTONICKÉ ŠABLONY FAKTURY A4 (INSPIROVANÉ CZ/EU SYSTÉMY)
   ========================================================================== */
.a4-sheet{
  --inv-p:#1976d2;
  --inv-s:#f0f7ff;
  --inv-tx:#1e293b;
  background:#fff;color:var(--inv-tx);border:1px solid #d5dbe5;border-radius:6px;
  padding:26px 28px;box-shadow:0 8px 28px rgba(0,0,0,.08);font-size:11.5px;line-height:1.42;
  position:relative;overflow:hidden;
}
.a4-logo{max-height:52px;max-width:180px;object-fit:contain;display:block}
.a4-tbl{width:100%;border-collapse:collapse;margin:12px 0;font-size:11.5px}
.a4-tbl th{padding:7px 8px;font-size:10px;text-transform:uppercase;letter-spacing:.04em}
.a4-tbl td{padding:7px 8px;border-bottom:1px solid #e2e8f0}
.qr-box svg{width:92px;height:92px;display:block}
.kv-list{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:11px}
.kv-list span{color:#64748b}
.kv-list b{text-align:right;color:var(--inv-tx)}
.sec-lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:#64748b;margin-bottom:4px}

/* 1. FAKTUROID CLEAN (2 sloupce: Vlevo Dodavatel+Banka, Vpravo Odběratel+Data+Částka) */
.tpl-fakturoid .f-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;padding-bottom:12px;border-bottom:2px solid var(--inv-p)}
.tpl-fakturoid .f-title{font-size:20px;font-weight:800;color:var(--inv-p);letter-spacing:-.02em}
.tpl-fakturoid .f-cols{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-bottom:16px}
.tpl-fakturoid .f-block{margin-bottom:12px}
.tpl-fakturoid .f-highlight{background:var(--inv-s);border-left:3px solid var(--inv-p);padding:10px 12px;border-radius:0 6px 6px 0}
.tpl-fakturoid .a4-tbl th{background:var(--inv-s);color:var(--inv-p);border-top:1px solid var(--inv-p);border-bottom:1px solid var(--inv-p)}
.tpl-fakturoid .f-bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-top:14px}
.tpl-fakturoid .f-total{background:var(--inv-p);color:#fff;padding:12px 16px;border-radius:6px;text-align:right;min-width:210px}

/* 2. iDOKLAD BANNER (Plný barevný horní pás, 3-sloupcový info strip, čisté karty) */
.tpl-idoklad{padding-top:0}
.tpl-idoklad .i-banner{
  background:var(--inv-p);color:#fff;margin:0 -28px 18px;padding:20px 28px;
  display:flex;justify-content:space-between;align-items:center;gap:14px;
}
.tpl-idoklad .i-banner .a4-logo{background:#fff;padding:4px 8px;border-radius:6px}
.tpl-idoklad .i-title{font-size:21px;font-weight:700;letter-spacing:.01em}
.tpl-idoklad .i-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px}
.tpl-idoklad .i-card{border:1px solid #dce3ec;border-radius:8px;padding:11px 13px;background:#fff}
.tpl-idoklad .i-strip{
  background:var(--inv-s);border:1px solid #dce3ec;border-radius:8px;padding:10px 14px;
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;font-size:11px;
}
.tpl-idoklad .a4-tbl th{background:#f1f5f9;color:#1e293b;border-bottom:2px solid var(--inv-p)}
.tpl-idoklad .i-foot{display:flex;justify-content:space-between;align-items:center;background:var(--inv-s);padding:12px 16px;border-radius:8px;margin-top:14px}

/* 3. STRIPE / MODERNÍ EDITORIAL (Asymetrický levý pruh, velká typografie, otevřený vzdušný layout) */
.tpl-editorial{border-left:10px solid var(--inv-p);padding-left:24px}
.tpl-editorial .e-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px}
.tpl-editorial .e-big{font-family:'Playfair Display',Georgia,serif;font-size:28px;font-weight:700;color:var(--inv-tx);line-height:1.1}
.tpl-editorial .e-num{font-size:13px;font-weight:700;color:var(--inv-p);margin-top:4px}
.tpl-editorial .e-grid{display:grid;grid-template-columns:1.1fr 1.1fr 0.9fr;gap:14px;padding:14px 0;border-top:1px solid #e2e8f0;border-bottom:1px solid #e2e8f0;margin-bottom:14px}
.tpl-editorial .a4-tbl th{background:transparent;color:var(--inv-p);border-bottom:2px solid var(--inv-tx);padding-left:0}
.tpl-editorial .a4-tbl td{padding-left:0}
.tpl-editorial .e-paybox{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-top:16px;padding-top:12px;border-top:2px solid var(--inv-tx)}
.tpl-editorial .e-bank{background:var(--inv-s);padding:10px 12px;border-radius:6px;flex:1}

/* 4. POHODA / ÚČETNÍ KLASIKA (Tradiční český daňový doklad s mřížkou a razítkem) */
.tpl-classic .c-box{border:1.5px solid #1e293b}
.tpl-classic .c-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1.5px solid #1e293b;background:var(--inv-s)}
.tpl-classic .c-grid2{display:grid;grid-template-columns:1fr 1fr;border-bottom:1.5px solid #1e293b}
.tpl-classic .c-cell{padding:10px 12px}
.tpl-classic .c-cell:first-child{border-right:1.5px solid #1e293b}
.tpl-classic .c-sub{border-top:1px dashed #94a3b8;margin-top:8px;padding-top:8px}
.tpl-classic .a4-tbl{margin:0;border-bottom:1.5px solid #1e293b}
.tpl-classic .a4-tbl th{background:#f1f5f9;border-bottom:1.5px solid #1e293b;border-right:1px solid #cbd5e1;color:#0f172a}
.tpl-classic .a4-tbl td{border-right:1px solid #e2e8f0}
.tpl-classic .c-foot{display:flex;justify-content:space-between;align-items:center;padding:12px 14px}

/* Dropdown & Upload Dropzones */
.dd{position:fixed;z-index:150;background:var(--card);border:1px solid var(--bd);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.22);max-height:260px;overflow:auto;padding:5px}
.dd .dh{font-size:11px;color:var(--mu);text-transform:uppercase;font-weight:600;padding:5px 9px}
.dd .it{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 9px;border-radius:7px;cursor:pointer}
.dd .it:hover{background:var(--acs)}
.dd .it small{display:block;color:var(--mu);font-size:11.5px}

.dropzone{
  border:2px dashed var(--bd);border-radius:10px;padding:18px;text-align:center;
  background:var(--bg);transition:border-color .15s,background .15s;
}
.dropzone:hover{border-color:var(--ac);background:var(--acs)}
.doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:12px}
.doc-item{border:1px solid var(--bd);border-radius:8px;padding:8px;background:var(--bg);font-size:12px;display:flex;flex-direction:column;gap:6px}
.doc-thumb{width:100%;height:90px;object-fit:cover;border-radius:5px;background:#fff;display:grid;place-items:center;font-size:28px}

.ban{background:var(--orange-bg);color:var(--orange);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ico-wrap{display:flex;gap:5px}
.ico-wrap input{flex:1}
.mob-tabs{display:none;margin-bottom:12px;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:4px}
.mob-tabs button{flex:1;border:0;background:none;padding:8px;border-radius:6px;font-weight:600;color:var(--mu);cursor:pointer}
.mob-tabs button.on{background:var(--ac);color:#fff}
.mob-lbl{display:none}
.act-btns{display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap}

@media (max-width:960px){
  .split-wrap{grid-template-columns:1fr}
  .mob-tabs{display:flex}
  .hide-mob{display:none!important}
  .tpl-grid{grid-template-columns:1fr 1fr}
}
@media (max-width:820px){
  .mob-bar{display:flex}
  aside{
    position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);
    box-shadow:4px 0 24px rgba(0,0,0,.4);
  }
  aside.open{transform:translateX(0)}
  main{padding:14px}
  .card{padding:14px}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kv{font-size:19px}
  button.b,button.g{min-height:40px;padding:8px 12px}
  input,select{min-height:40px;font-size:15px}

  .mob-cards table,.mob-cards thead,.mob-cards tbody,.mob-cards tr,.mob-cards td{display:block;width:100%}
  .mob-cards thead{display:none}
  .mob-cards tr{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
  .mob-cards td{border:0;padding:3px 0;text-align:left!important;white-space:normal}
  .mob-lbl{display:inline-block;font-size:11px;color:var(--mu);font-weight:600;text-transform:uppercase;margin-bottom:2px}

  .inv-table tr{display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center}
  .inv-table td.c-num{grid-column:1;font-size:15.5px}
  .inv-table td.c-tot{grid-column:2;text-align:right!important;font-size:15.5px}
  .inv-table td.c-cli{grid-column:1/-1;font-weight:600}
  .inv-table td.c-dates{grid-column:1;font-size:12px}
  .inv-table td.c-st{grid-column:2;text-align:right!important}
  .inv-table td.c-act{grid-column:1/-1;margin-top:8px;padding-top:8px;border-top:1px solid var(--bd)}

  .stock-table tr,.edit-table tr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .stock-table td.c-full,.edit-table td.c-full{grid-column:1/-1}
  .stock-table td.c-act,.edit-table td.c-act{grid-column:1/-1;margin-top:4px;padding-top:8px;border-top:1px solid var(--bd)}

  .act-btns{display:grid;grid-template-columns:1fr 1fr;gap:7px;width:100%}
  .act-btns button{width:100%}
  .act-btns button.btn-wide,.act-btns button.d{grid-column:1/-1}
}

@media print{
  @page{size:A4;margin:10mm}
  body{background:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  aside,.mob-bar,.noprint,.edit-form-col,.mob-tabs,.page-head,.ban,.tpl-bar{display:none!important}
  .app,.mainwrap,main,.split-wrap,.preview-sticky{display:block!important;position:static!important;padding:0!important;margin:0!important;max-width:100%!important;width:100%!important}

<div id="dd" class="dd" hidden></div>

<script>
function uid(){return Math.random().toString(36).slice(2,9)}
function e(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function today(d){return new Date(Date.now()+(d||0)*864e5).toISOString().slice(0,10)}
function money(n){return (Number(n)||0).toLocaleString('cs-CZ',{minimumFractionDigits:2,maximumFractionDigits:2})+' Kč'}

function defaultStyle(){
  return {
    tpl: 'fakturoid',      // 'fakturoid' | 'idoklad' | 'editorial' | 'classic'
    primary: '#1976d2',
    secondary: '#f0f7ff',
    text: '#1e293b',
    swapParties: false,    // prohodit Dodavatel <-> Odběratel
    showBankTop: false,    // bankovní údaje nahoře v hlavičce vs. dole u QR
    showQr: true,
    compactItems: false
  };
}

function mk(n){
  return {
    name:n,ico:'',dic:'',addr:'',iban:'',bank:'',next:1,vatPayer:'ano',
    logo:'',
    style: defaultStyle(),
    regInfo:'Podnikatel zapsaný v živnostenském rejstříku.'
  };
}

var STORAGE_KEY = 'dokladoid_fakturoid_v3';
var STORE = {
  active: 'a',
  theme: '',
  currentUser: 'Jan',
  fbConfig: '',
  geminiKey: '',
  fioToken: '',
  tgToken: '',
  tgChatId: '',
  emailJsService: '',
  emailJsTemplate: '',
  emailJsKey: '',
  promoEnabled: true,
  promoBuyQty: 80,
  promoFreeQty: 8,
  snapshots: [],
  profiles: { a: mk('Moje Firma s.r.o.'), b: mk('Druhá Firma s.r.o.') },
  categories: ['Jednorázové e-cigarety', 'Předplněné pody / Cartridge', 'Sety e-cigaret & Pod systémy', 'Liquidy', 'Bez nikotinu (0 mg)', 'Nikotinové sáčky & Tabák', 'Baterie & Příslušenství', 'Ostatní'],
  data: {
    a: { stock: [], invoices: [], clients: [], docs: [] },
    b: { stock: [], invoices: [], clients: [], docs: [] }
  }
};

function loadStore(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('dokladoid_fakturoid_v2') || localStorage.getItem('dokladoid_fakturoid_v1');
    if(raw){
      var p = JSON.parse(raw);
      if(p.profiles){
        ['a','b'].forEach(function(k){
          if(p.profiles[k]){
            STORE.profiles[k] = Object.assign(mk(''), p.profiles[k]);
            STORE.profiles[k].style = Object.assign(defaultStyle(), p.profiles[k].style || {});
          }
        });
      }
      if(p.data){
        STORE.data = Object.assign(STORE.data, p.data);
        ['a','b'].forEach(function(k){ if(!STORE.data[k].docs) STORE.data[k].docs = []; });
      }
      if(p.active) STORE.active = p.active;
      if(p.currentUser) STORE.currentUser = p.currentUser;
      if(p.fbConfig) STORE.fbConfig = p.fbConfig;
      if(p.geminiKey) STORE.geminiKey = p.geminiKey;
      if(p.fioToken) STORE.fioToken = p.fioToken;
      if(p.tgToken) STORE.tgToken = p.tgToken;
      if(p.tgChatId) STORE.tgChatId = p.tgChatId;
      if(p.emailJsService) STORE.emailJsService = p.emailJsService;
      if(p.emailJsTemplate) STORE.emailJsTemplate = p.emailJsTemplate;
      if(p.emailJsKey) STORE.emailJsKey = p.emailJsKey;
      if(p.promoEnabled !== undefined) STORE.promoEnabled = p.promoEnabled;
      if(p.promoBuyQty) STORE.promoBuyQty = p.promoBuyQty;
      if(p.promoFreeQty) STORE.promoFreeQty = p.promoFreeQty;
      if(Array.isArray(p.snapshots)) STORE.snapshots = p.snapshots;
      if(p.categories && Array.isArray(p.categories)) STORE.categories = p.categories;
      if(p.theme){ STORE.theme = p.theme; document.documentElement.setAttribute('data-theme', p.theme); }
    }
  }catch(err){}
}
function createAutoSnapshot(){
  try{
    var d = today();
    if(!Array.isArray(STORE.snapshots)) STORE.snapshots = [];
    var exists = STORE.snapshots.some(function(s){ return s.date === d; });
    if(!exists){
      var snapData = JSON.stringify({profiles: STORE.profiles, data: STORE.data});
      if(snapData.length < 1500000){
        STORE.snapshots.unshift({id: uid(), date: d, ts: Date.now(), by: STORE.currentUser, payload: snapData});
        if(STORE.snapshots.length > 7) STORE.snapshots = STORE.snapshots.slice(0, 7);
      }
    }
  }catch(e){}
}
function saveStore(){
  createAutoSnapshot();
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STORE)); }catch(err){
    alert('Paměť prohlížeče je plná. Zmenšete nahrané obrázky/logo nebo smažte staré přílohy.');
  }
  pushCloud();
}
loadStore();

/* ---------- Cloud Sync (Firebase Realtime Database pro 3 uživatele) ---------- */
var cloudUrl = '';
var syncTimer = null;

function initCloud(){
  if(!STORE.fbConfig) return;
  try{
    var cfg = typeof STORE.fbConfig === 'string' ? JSON.parse(STORE.fbConfig) : STORE.fbConfig;
    if(cfg && cfg.databaseURL){
      cloudUrl = cfg.databaseURL.replace(/\/$/,'') + '/dokladoid_shared.json';
      pullCloud(true);
      if(syncTimer) clearInterval(syncTimer);
      syncTimer = setInterval(function(){ pullCloud(false); }, 4000);
    }
  }catch(err){ updateSyncUI(false, 'Chyba Firebase URL'); }
}

function updateSyncUI(ok, txt){
  var dot = document.getElementById('syncDot');
  var el = document.getElementById('syncText');
  if(dot) dot.className = 'dot' + (ok ? ' ok' : '');
  if(el) el.textContent = txt;
}

async function pullCloud(first){
  if(!cloudUrl) return;
  try{
    var res = await fetch(cloudUrl);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    var remote = await res.json();
    if(remote && remote.profiles && remote.data){
      var localStr = JSON.stringify({profiles:STORE.profiles, data:STORE.data});
      var remStr = JSON.stringify({profiles:remote.profiles, data:remote.data});
      if(localStr !== remStr){
        STORE.profiles = remote.profiles;
        STORE.data = remote.data;
        ['a','b'].forEach(function(k){
          if(!STORE.data[k].docs) STORE.data[k].docs = [];
          if(!STORE.profiles[k].style) STORE.profiles[k].style = defaultStyle();
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(STORE));
        if(V.p !== 'edit') R();
      }
    } else if(first){ pushCloud(); }
    updateSyncUI(true, 'Online sync (3 uživatelé)');
  }catch(err){ updateSyncUI(false, 'Offline / chyba sync'); }
}

async function pushCloud(){
  if(!cloudUrl) return;
  try{
    await fetch(cloudUrl, {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({profiles: STORE.profiles, data: STORE.data, updatedBy: STORE.currentUser, updatedAt: Date.now()})
    });
    updateSyncUI(true, 'Uloženo v cloudu');
  }catch(err){ updateSyncUI(false, 'Chyba odeslání'); }
}

/* ---------- Stav aplikace ---------- */
var V = {p:'dash'}, cur = null, IMP = null, icoMsg = '', invFilter = 'all', invSearch = '', mobTab = 'form', showStyleEditor = false;
function C(){ return STORE.profiles[STORE.active]; }
function D(){ return STORE.data[STORE.active]; }

function toggleMenu(force){
  var sb = document.getElementById('sidebar');
  var bd = document.getElementById('backdrop');
  var open = force !== undefined ? force : !sb.classList.contains('open');
  sb.classList.toggle('open', open);
  bd.classList.toggle('show', open);
}

function toggleTheme(){
  var nextT = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', nextT);
  STORE.theme = nextT;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(STORE));
}

function setUser(u){
  STORE.currentUser = u;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(STORE));
}

function wr(n, o){
  o = JSON.parse(JSON.stringify(o));
  if(!D()[n]) D()[n] = [];
  var arr = D()[n];
  var i = arr.findIndex(function(x){return x.id===o.id});
  if(i>=0) arr[i] = o; else arr.push(o);
  saveStore();
  R();
}
function rm(n, id){
  D()[n] = D()[n].filter(function(x){return x.id!==id});
  saveStore();
  R();
}
function wrP(k, v){ C()[k] = v; saveStore(); }
function find(n, id){ return (D()[n]||[]).filter(function(x){return x.id===id})[0]; }
function srt(a, k){ return (a||[]).slice().sort(function(x,y){return String(x[k]||'').localeCompare(String(y[k]||''),'cs')}); }

function go(p, id){
  toggleMenu(false);
  V = {p:p, id:id};
  icoMsg = '';
  mobTab = 'form';
  if(p==='edit'){
    cur = id ? JSON.parse(JSON.stringify(find('invoices', id))) : newInv();
    if(!cur.attachments) cur.attachments = [];
    cur.style = Object.assign(defaultStyle(), C().style || {}, cur.style || {});
  }
  R();
  window.scrollTo(0,0);
}

function switchCo(id){
  STORE.active = id;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(STORE));
  V = {p:'dash'};
  R();
}

function blank(){ return {name:'',qty:1,unit:'ks',price:0,buyPrice:0,vat:C().vatPayer==='ne'?0:21}; }
function newInv(){
  var y = new Date().getFullYear(), n = ''+y+String(C().next).padStart(4,'0');
  return {
    id:uid(), docType:'invoice', number:n, vs:n,
    client:'', cico:'', cdic:'', caddr:'',
    issue:today(), duzp:today(), due:today(14),
    note:'', items:[blank()], status:'open',
    style: JSON.parse(JSON.stringify(C().style || defaultStyle())),
    attachments: [],
    deduct:true, deducted:false, isNew:true,
    createdBy: STORE.currentUser
  };
}
function calc(inv){
  var z=0, d=0, cost=0;
  inv.items.forEach(function(it){
    var l = (Number(it.qty)||0) * (Number(it.price)||0);
    z += l;
    d += l * (Number(it.vat)||0) / 100;
    cost += (Number(it.qty)||0) * (Number(it.buyPrice)||0);
  });
  return {z:z, d:d, t:z+d, profit: z - cost};
}
function stBadge(i){
  if(i.status==='paid') return ['Zaplaceno','paid'];
  if(i.due && i.due < today()) return ['Po splatnosti','over'];
  if(i.status==='sent') return ['Odesláno','sent'];
  if(i.status==='draft') return ['Koncept','draft'];
  return ['Vystaveno','open'];
}

function compressImage(file, maxW, quality, cb){
  var reader = new FileReader();
  reader.onload = function(ev){
    var img = new Image();
    img.onload = function(){
      var w = img.width, h = img.height;
      if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL(file.type === 'image/png' ? 'image/png' : 'image/jpeg', quality));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

/* ---------- ARES ---------- */
async function fetchAres(ico, onSuccess){
  ico = String(ico||'').replace(/\s/g,'');
  if(!/^\d{8}$/.test(ico)){ icoMsg = 'Zadejte platné 8místné IČO.'; R(); return; }
  icoMsg = 'Hledám v registru ARES…'; R();
  try{
    var res = await fetch('https://ares.gov.cz/ekonomicke-subjekty-v-be/rest/ekonomicke-subjekty/' + ico);
    if(!res.ok) throw new Error('Subjekt v ARES nenalezen.');
    var data = await res.json();
    var s = data.sidlo || {};
    var ulice = s.nazevUlice ? (s.nazevUlice + ' ' + (s.cisloDomovni||'') + (s.cisloOrientacni ? '/'+s.cisloOrientacni : '')) : ((s.nazevCastiObce||s.nazevObce||'') + ' ' + (s.cisloDomovni||''));
    var addr = (ulice.trim() ? ulice.trim() + ', ' : '') + (s.psc ? String(s.psc).replace(/(\d{3})(\d{2})/,'$1 $2') + ' ' : '') + (s.nazevObce||'');
    onSuccess({name: data.obchodniJmeno||'', dic: data.dic||'', addr: addr.trim()});
    icoMsg = 'Načteno z ARES.';
  }catch(err){ icoMsg = 'Chyba ARES: ' + err.message; }
  R();
}

var ICO={
  dash:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
  inv:'<path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6M9 13h8M9 17h6"/>',
  bank:'<rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/>',
  docs:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>',
  cli:'<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-7 7-7s7 3 7 7M17 4a4 4 0 010 8M22 21c0-3-2-5-4-6"/>',
  stock:'<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  imp:'<path d="M12 3v12M7 10l5 5 5-5M4 21h16"/>',
  exp:'<path d="M14 2H6v20h12V8z"/><path d="M14 2v6h6M12 18v-6M9 15l3 3 3-3"/>',
  set:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'
};
function ic(k){return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ICO[k]+'</svg>'}

function R(){
  document.getElementById('co').innerHTML = ['a','b'].map(function(k){return '<option value="'+k+'"'+(k===STORE.active?' selected':'')+'>'+e(STORE.profiles[k].name)+'</option>'}).join('');
  document.getElementById('userSel').value = STORE.currentUser || 'Jan';
  var tabs = [['dash','Přehled'],['inv','Faktury'],['bank','Banka & Párování'],['docs','Přijaté doklady / Foto'],['cli','Kontakty'],['stock','Sklad & Ceník'],['imp','Naskladnit (Foto/PDF/XLS)'],['exp','Export Pohoda'],['set','Nastavení & Automatizace']];
  document.getElementById('nav').innerHTML = tabs.map(function(t){
    var act = (V.p===t[0] || (V.p==='edit' && t[0]==='inv'));
    return '<button class="'+(act?'on':'')+'" onclick="go(\''+t[0]+'\')">'+ic(t[0])+'<span>'+t[1]+'</span></button>';
  }).join('');
  document.getElementById('app').innerHTML = (V.p==='dash'?vDash():V.p==='inv'?vInv():V.p==='edit'?vEdit():V.p==='bank'?vBank():V.p==='docs'?vDocs():V.p==='stock'?vStock():V.p==='cli'?vCli():V.p==='imp'?vImp():V.p==='exp'?vExp():vSet());
  if(V.p==='edit') upd();
}

/* ---------- Přehled ---------- */
function vDash(){
  var inv = D().invoices, op=0, od=0, pd=0, prof=0, t=today(), now=new Date(), mo=[];
  inv.forEach(function(i){
    var c = calc(i);
    if(i.status==='paid'){ pd += c.t; prof += c.profit; }
    else if(i.status!=='draft'){ op += c.t; if(i.due && i.due<t) od += c.t; }
  });
  for(var k=5;k>=0;k--){
    var d = new Date(now.getFullYear(), now.getMonth()-k, 1);
    mo.push({key:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'), lb:d.toLocaleString('cs-CZ',{month:'short'}), v:0});
  }
  inv.forEach(function(i){
    if(i.status==='draft') return;
    var m = mo.filter(function(x){return x.key===String(i.issue||'').slice(0,7)})[0];
    if(m) m.v += calc(i).t;
  });
  var mx = Math.max.apply(null, mo.map(function(x){return x.v}).concat([1]));
  var lowItems = D().stock.filter(function(s){return (Number(s.qty)||0) <= (Number(s.minQty)||0)});

  var rec = srt(inv,'number').reverse().slice(0,6).map(function(i){
    var s = stBadge(i);
    return '<tr class="clk" onclick="go(\'edit\',\''+i.id+'\')"><td><b>'+e(i.number)+'</b></td><td>'+e(i.client||'—')+'</td><td class="mu">'+e(i.due)+'</td><td><span class="bd '+s[1]+'">'+s[0]+'</span></td><td class="r"><b>'+money(calc(i).t)+'</b></td></tr>';
  }).join('');

  var warn = !C().ico ? '<div class="ban"><span>⚙️ Doplňte IČO, logo a IBAN v <b>Nastavení</b>, aby se správně generoval náhled faktury a QR platba.</span><button class="g" onclick="go(\'set\')">Nastavit</button></div>' : '';

  return '<div class="page-head"><h1>Přehled – '+e(C().name)+'</h1><div class="row"><button class="g" onclick="go(\'docs\')">📷 Vyfotit doklad</button><button class="b grn" onclick="go(\'edit\')">+ Vystavit fakturu</button></div></div>'+
  warn + remBox() +
  '<div class="kpis">'+
    '<div class="kpi k-blu"><div class="kl">Neuhrazené faktury</div><div class="kv">'+money(op)+'</div><div class="ks">Čeká na platbu</div></div>'+
    '<div class="kpi k-red"><div class="kl">Po splatnosti</div><div class="kv" style="color:'+(od>0?'var(--red)':'inherit')+'">'+money(od)+'</div><div class="ks">Nutno urgovat</div></div>'+
    '<div class="kpi k-grn"><div class="kl">Uhrazeno celkem</div><div class="kv" style="color:var(--green)">'+money(pd)+'</div><div class="ks">Hrubý zisk: '+money(prof)+'</div></div>'+
    '<div class="kpi k-org"><div class="kl">Pod minimem skladu</div><div class="kv" style="color:'+(lowItems.length?'var(--orange)':'inherit')+'">'+lowItems.length+' pol.</div><div class="ks">Položky k doobjednání</div></div>'+
  '</div>'+
  '<div class="card"><h2>Tržby za posledních 6 měsíců (vč. DPH)</h2><div class="bars">'+mo.map(function(x){return '<div class="bar" title="'+money(x.v)+'"><div class="bv" style="height:'+Math.round(x.v/mx*100)+'%"></div><span>'+x.lb+'</span></div>'}).join('')+'</div></div>'+
  '<div class="card"><h2>Poslední doklady</h2>'+(rec?'<div class="w"><table><thead><tr><th>Číslo</th><th>Odběratel</th><th>Splatnost</th><th>Stav</th><th class="r">Částka</th></tr></thead><tbody>'+rec+'</tbody></table></div>':'<p class="mu">Zatím jste nevystavili žádnou fakturu.</p>')+'</div>';
}

/* ---------- Faktury ---------- */
function vInv(){
  var c = C(), t = today();
  var filtered = srt(D().invoices,'number').reverse().filter(function(i){
    if(invFilter==='paid' && i.status!=='paid') return false;
    if(invFilter==='open' && (i.status==='paid' || i.status==='draft' || (i.due && i.due<t))) return false;
    if(invFilter==='overdue' && (i.status==='paid' || i.status==='draft' || !i.due || i.due>=t)) return false;
    if(invSearch){
      var q = invSearch.toLowerCase();
      if(String(i.number).toLowerCase().indexOf(q)===-1 && String(i.client||'').toLowerCase().indexOf(q)===-1) return false;
    }
    return true;
  });

  var rows = filtered.map(function(i){
    var s = stBadge(i), pd = i.status==='paid';
    var typeTag = i.docType==='proforma' ? '<span class="mu" style="font-size:11px">[Záloha] </span>' : '';
    var attCount = (i.attachments && i.attachments.length) ? ' <span class="mu" title="Počet příloh">📎'+i.attachments.length+'</span>' : '';
    return '<tr>'+

function addInvAttachment(file){
  if(!file) return;
  if(file.type.indexOf('image/') === 0){
    compressImage(file, 1200, 0.78, function(dataUrl){
      cur.attachments.push({id:uid(), name:file.name||'foto_doklad.jpg', type:file.type, data:dataUrl, date:today()});
      R();
    });
  } else {
    if(file.size > 2.5 * 1024 * 1024){ alert('PDF soubor je větší než 2,5 MB.'); return; }
    var r = new FileReader();
    r.onload = function(ev){
      cur.attachments.push({id:uid(), name:file.name, type:file.type, data:ev.target.result, date:today()});
      R();
    };
    r.readAsDataURL(file);
  }
}
function openAttachment(idx){
  var att = cur.attachments[idx];
  if(!att) return;
  var w = window.open('');
  if(att.data.indexOf('data:image') === 0) w.document.write('<img src="'+att.data+'" style="max-width:100%">');
  else w.document.write('<iframe src="'+att.data+'" style="width:100%;height:100vh;border:0"></iframe>');
}

function fld(l,k,v,t){return '<div><label>'+l+'</label><input type="'+(t||'text')+'" value="'+e(v)+'" oninput="cur[\''+k+'\']=this.value;upd()"></div>'}
function getPriceForClient(stockItem, clientName){
  var base = Number(stockItem.price)||0;
  if(!clientName) return base;
  var c = D().clients.filter(function(x){return x.name.toLowerCase()===clientName.toLowerCase()})[0];
  if(!c || !c.priceTier || c.priceTier==='base') return base;
  if(c.priceTier==='vo' && Number(stockItem.voPrice)>0) return Number(stockItem.voPrice);
  if(c.priceTier==='vip') return Math.round(base * 0.90 * 100)/100;
  return base;
}
function cliChg(v){
  cur.client = v;
  var c = D().clients.filter(function(x){return x.name.toLowerCase()===v.toLowerCase()})[0];
  if(c){
    cur.cico=c.ico||''; cur.cdic=c.dic||''; cur.caddr=c.addr||''; cur.cemail=c.email||'';
    // Přepočítat ceny stávajících skladových položek podle cenové hladiny odběratele
    cur.items.forEach(function(it){
      if(it.sid && !it.isBonus){
        var s = find('stock', it.sid);
        if(s) it.price = getPriceForClient(s, v);
      }
    });
    R();
  } else upd();
}
function icoOk(v){
  v = String(v).replace(/\s/g,'');
  if(!/^\d{8}$/.test(v)) return false;
  var s = 0; for(var i=0;i<7;i++) s += (+v[i])*(8-i);
  var c = 11 - s%11; if(c===10) c=0; if(c===11) c=1;
  return c === +v[7];
}
function icoChg(v){
  v = v.replace(/\s/g,'');
  cur.cico = v; icoMsg = '';
  if(v){
    if(!icoOk(v)){ icoMsg = 'Neplatné IČO.'; R(); }
    else {
      var c = D().clients.filter(function(x){return String(x.ico).replace(/\s/g,'')===v})[0];
      if(c){ cur.client=c.name; cur.caddr=c.addr||''; cur.cdic=c.dic||''; icoMsg='Nalezeno v kontaktech.'; R(); }
      else { fetchAres(v, function(d){ cur.client=d.name; cur.cdic=d.dic; cur.caddr=d.addr; }); }
    }
  } else R();
}

}

  if(s){it.sid=s.id; it.unit=s.unit; it.price=s.price; it.buyPrice=s.buyPrice||0; it.vat=s.vat; R();} else {delete it.sid; upd();}
}

function applyPromoBonus(){
  var buyQ = Number(STORE.promoBuyQty)||80;
  var freeQ = Number(STORE.promoFreeQty)||8;
  var added = 0;
  var newItems = [];
  cur.items.forEach(function(it){
    newItems.push(it);
    if(!it.isBonus && Number(it.qty) >= buyQ && it.name){
      var mult = Math.floor(Number(it.qty) / buyQ);
      var bonusTotal = mult * freeQ;
      // Zkontrolovat jestli už bonusový řádek pro tuto položku neexistuje
      var already = cur.items.some(function(x){ return x.isBonus && x.name.indexOf(it.name) > -1; });
      if(!already && bonusTotal > 0){
        newItems.push({
          name: it.name + ' (BONUS AKCE ' + buyQ + '+' + freeQ + ')',
          qty: bonusTotal,
          unit: it.unit || 'ks',
          price: 0,
          buyPrice: it.buyPrice || 0,
          vat: it.vat,
          sid: it.sid || '',
          isBonus: true
        });
        added++;
      }
    }
  });
  if(!added){
    alert('Žádná položka na faktuře nedosahuje minimálního množství ' + buyQ + ' ks (nebo už bonus obsahuje).');
    return;
  }
  cur.items = newItems;
  R();
}

function cpRow(n){cur.items.splice(n+1,0,JSON.parse(JSON.stringify(cur.items[n]))); R();}
function rmRow(n){cur.items.splice(n,1); if(!cur.items.length) cur.items.push(blank()); R();}
function fromStock(id){
  if(!id) return; var s=find('stock',id); if(!s) return;
  var last=cur.items[cur.items.length-1], it={name:s.name,qty:1,unit:s.unit,price:getPriceForClient(s, cur.client),buyPrice:s.buyPrice||0,vat:s.vat,sid:s.id};
  if(cur.items.length===1 && !last.name && !last.price) cur.items[0]=it; else cur.items.push(it); R();
}
function vatSplit(inv){
  var m={};
  inv.items.forEach(function(it){var r=it.vat, l=it.qty*it.price; m[r]=m[r]||{r:r,z:0,d:0}; m[r].z+=l; m[r].d+=l*r/100;});
  return Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return b.r-a.r});
}
function ascii(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7e]/g,'').replace(/\*/g,'')}
function qrSvg(total){
  if(cur.style && cur.style.showQr === false) return '';
  var iban=(C().iban||'').replace(/\s/g,'').toUpperCase();
  if(!iban) return '<div style="font-size:10px;color:#64748b;max-width:110px">Pro QR kód doplňte IBAN v Nastavení.</div>';
  var vs=String(cur.vs||'').replace(/\D/g,'').slice(0,10);
  var spd='SPD*1.0*ACC:'+iban+'*AM:'+(Math.round(total*100)/100).toFixed(2)+'*CC:CZK'+(vs?'*X-VS:'+vs:'')+'*MSG:'+ascii('Faktura '+cur.number).slice(0,60);
  try{
    if(typeof qrcode==='undefined') return '';
    var q=qrcode(0,'M'); q.addData(spd); q.make();
    return '<div class="qr-box">'+q.createSvgTag({cellSize:3,margin:1,scalable:true})+'<div style="font-size:9.5px;text-align:center;color:#64748b;margin-top:2px">QR platba</div></div>';
  }catch(x){return '';}
}

function saveInv(){
  cur.items = cur.items.filter(function(it){return it.name || it.price});
  if(!cur.items.length) cur.items = [blank()];
  var wasNew = cur.isNew; delete cur.isNew;
  if(cur.deduct && !cur.deducted && cur.docType!=='proforma'){
    cur.items.forEach(function(it){
      var s = it.sid && find('stock', it.sid);
      if(s) wr('stock', Object.assign({}, s, {qty: Math.round((s.qty - it.qty)*1000)/1000}));
    });
    cur.deducted = true;
  }
  if(cur.client && !D().clients.some(function(c){return c.name.toLowerCase()===cur.client.toLowerCase()})){
    wr('clients', {id:uid(), name:cur.client, ico:cur.cico||'', dic:cur.cdic||'', addr:cur.caddr||''});
  }
  wr('invoices', cur);
  if(wasNew){
    wrP('next', C().next + 1);
    notifyTelegramNewInvoice(cur);
  }
  go('inv');
}

async function notifyTelegramNewInvoice(inv){
  if(!STORE.tgToken || !STORE.tgChatId) return;
  try{
    var t = calc(inv);
    var lowCount = D().stock.filter(function(s){ return (Number(s.qty)||0) <= (Number(s.minQty)||0); }).length;
    var msg = '🧾 *Nová faktura (' + C().name + ')*\n' +
              'Číslo: *' + inv.number + '*\n' +
              'Odběratel: ' + (inv.client || '—') + '\n' +
              'Částka: *' + money(t.t) + '*\n' +
              'Vystavil: ' + (inv.createdBy || STORE.currentUser) +
              (lowCount > 0 ? '\n⚠️ Sklad pod limitem: ' + lowCount + ' položek' : '');
    await fetch('https://api.telegram.org/bot' + encodeURIComponent(STORE.tgToken) + '/sendMessage', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({chat_id: STORE.tgChatId, text: msg, parse_mode: 'Markdown'})
    });
  }catch(e){}
}

async function sendInvoiceEmail(id){
  var inv = find('invoices', id);
  if(!inv) return;
  var cli = D().clients.filter(function(x){ return x.name.toLowerCase() === String(inv.client||'').toLowerCase(); })[0];
  var toEmail = inv.cemail || (cli && cli.email) || prompt('Zadejte e-mail odběratele:', '');
  if(!toEmail) return;
  var t = calc(inv);
  var isOverdue = inv.status !== 'paid' && inv.due && inv.due < today();
  var subj = isOverdue
    ? 'Upomínka úhrady faktury č. ' + inv.number + ' (' + C().name + ')'
    : 'Faktura č. ' + inv.number + ' – ' + C().name;
  var bodyText = (isOverdue
    ? 'Dobrý den,\n\ndovolujeme si Vás upozornit na neuhrazenou fakturu č. ' + inv.number + ' po splatnosti (' + inv.due + ').\n'
    : 'Dobrý den,\n\nzasíláme Vám údaje k úhradě faktury č. ' + inv.number + '.\n') +
    'Částka k úhradě: ' + money(t.t) + '\n' +
    'Variabilní symbol: ' + inv.vs + '\n' +
    'Číslo účtu: ' + (C().bank || C().iban || '—') + '\n' +
    'Datum splatnosti: ' + inv.due + '\n\n' +
    'S pozdravem,\n' + C().name;

  if(STORE.emailJsService && STORE.emailJsTemplate && STORE.emailJsKey && typeof emailjs !== 'undefined'){
    try{
      emailjs.init(STORE.emailJsKey);
      await emailjs.send(STORE.emailJsService, STORE.emailJsTemplate, {
        to_email: toEmail,
        to_name: inv.client || 'Zákazníku',
        from_name: C().name,
        subject: subj,
        invoice_number: inv.number,
        amount: money(t.t),
        vs: inv.vs,
        due_date: inv.due,
        bank_account: C().bank || C().iban || '',
        message: bodyText
      });
      if(inv.status === 'open') wr('invoices', Object.assign({}, inv, {status: 'sent'}));
      alert('✅ E-mail byl úspěšně odeslán na adresu ' + toEmail);
      return;
    }catch(err){
      alert('Chyba EmailJS (' + (err.text || err.message) + '), otevírám výchozí e-mailový klient.');
    }
  }
  if(inv.status === 'open') wr('invoices', Object.assign({}, inv, {status: 'sent'}));
  window.location.href = 'mailto:' + encodeURIComponent(toEmail) + '?subject=' + encodeURIComponent(subj) + '&body=' + encodeURIComponent(bodyText);
}

function uploadDocFile(file){
  if(!file) return;
  var title = document.getElementById('docTitle').value.trim() || file.name;
  var cat = document.getElementById('docCat').value;
  if(file.type.indexOf('image/') === 0){
    compressImage(file, 1400, 0.8, function(dataUrl){
      wr('docs', {id:uid(), title:title, name:file.name, category:cat, date:today(), data:dataUrl});
    });
  } else {
    if(file.size > 3 * 1024 * 1024){ alert('PDF soubor je větší než 3 MB.'); return; }
    var r = new FileReader();
    r.onload = function(ev){
      wr('docs', {id:uid(), title:title, name:file.name, category:cat, date:today(), data:ev.target.result});
    };
    r.readAsDataURL(file);
  }

function cleanAndMergeStock(){
  var list = D().stock || [];
  if(!list.length){ alert('Sklad je prázdný.'); return; }
  var map = {}, mergedCount = 0;
  list.forEach(function(item){
    var cleanN = cleanProductName(item.name);
    if(!cleanN) cleanN = item.name;
    var key = cleanN.toLowerCase();
    if(map[key]){
      map[key].qty = Math.round(((Number(map[key].qty)||0) + (Number(item.qty)||0))*1000)/1000;
      if(!map[key].buyPrice && item.buyPrice) map[key].buyPrice = item.buyPrice;
      if(!map[key].voPrice && item.voPrice) map[key].voPrice = item.voPrice;
      mergedCount++;
    } else {
      map[key] = Object.assign({}, item, {
        name: cleanN,
        category: item.category || guessCategory(cleanN)
      });
    }
  });
  D().stock = Object.keys(map).map(function(k){ return map[k]; });
  saveStore();
  R();
  alert('Sklad byl vyčištěn! Odstraněny štítky/čísla a sloučeno duplicitních karet: ' + mergedCount);
}

function handleImportFile(file){
  if(!file) return;
  var st = document.getElementById('fileImpStatus');
  st.textContent = 'Načítám soubor ' + file.name + '…';
  var ext = file.name.split('.').pop().toLowerCase();
  var defVat = C().vatPayer==='ne' ? 0 : 21;

  if(ext === 'xml'){
    var r = new FileReader();
    r.onload = function(ev){
      try{
        var parser = new DOMParser();
        var xml = parser.parseFromString(ev.target.result, 'text/xml');
        var res = [];
        var nodes = xml.querySelectorAll('SHOPITEM, stockItem, item, polozka, ZBOZI, KARTA, invoiceItem');
        if(!nodes.length) nodes = xml.querySelectorAll('*');
        nodes.forEach(function(nd){
          var getT = function(tags){
            for(var k=0;k<tags.length;k++){
              var el = nd.getElementsByTagName(tags[k])[0] || nd.querySelector(tags[k]);
              if(el && el.textContent.trim()) return el.textContent.trim();
            }
            return '';
          };
          var name = getT(['PRODUCTNAME','NAME','NAZEV','TEXT','name','nazev','text','ITEM_NAME']);
          if(name && nd.children.length >= 2 && nd.children.length <= 25){
            var qty = parseFloat(getT(['QUANTITY','MNOZSTVI','STAV','QTY','STOCK','quantity','mnozstvi','stav']).replace(',','.')) || 1;
            var unit = getT(['UNIT','MJ','JEDNOTKA','unit','mj']) || 'ks';
            var price = parseFloat(getT(['PRICE_VAT','PRICE','CENA','SELL_PRICE','UNITPRICE','price','cena','unitPrice']).replace(',','.').replace(/[^\d.-]/g,'')) || 0;
            var buy = parseFloat(getT(['BUY_PRICE','NAKUP','PURCHASE_PRICE','nakup']).replace(',','.').replace(/[^\d.-]/g,'')) || 0;
            var vatRaw = getT(['VAT','DPH','RATEVAT','vat','dph']);
            var vat = vatRaw ? (vatRaw==='high'?21:(vatRaw==='low'?12:(parseFloat(vatRaw)||defVat))) : defVat;
            if(!res.some(function(x){return x.name===name && x.price===price})){
              var cleanN = cleanProductName(name); res.push({name:cleanN, category:guessCategory(cleanN), qty:qty, unit:unit, buyPrice:buy, price:price, vat:vat});
            }
          }
        });
        if(!res.length) throw new Error('V XML nebyly nalezeny žádné skladové položky.');
        IMP = res; R();
      }catch(err){ st.textContent = 'Chyba XML: ' + err.message; }
    };
    r.readAsText(file);
  } else if(ext === 'xlsx' || ext === 'xls' || ext === 'csv'){
    var r = new FileReader();
    r.onload = function(ev){
      try{
        if(typeof XLSX === 'undefined') throw new Error('Knihovna pro Excel se ještě nenačetla.');
        var wb = XLSX.read(ev.target.result, {type: 'array'});
        var sheet = wb.Sheets[wb.SheetNames[0]];
        var rows = XLSX.utils.sheet_to_json(sheet, {header: 1});
        var res = [];
        rows.forEach(function(row, idx){
          if(!row || !row.length) return;
          var c0 = String(row[0]||'').trim();
          if(!c0) return;
          if(idx === 0 && /název|nazev|položka|polozka|name|produkt/i.test(c0)) return;
          var qty = parseFloat(String(row[1]||'1').replace(',','.')) || 1;
          var unit = String(row[2]||'ks').trim() || 'ks';
          var price = parseFloat(String(row[3]||'0').replace(',','.').replace(/[^\d.-]/g,'')) || 0;
          var vat = row[4]!==undefined && row[4]!=='' ? (parseFloat(row[4])||0) : defVat;
          var buy = row[5]!==undefined && row[5]!=='' ? (parseFloat(String(row[5]).replace(',','.'))||0) : 0;
          var cleanN = cleanProductName(c0); res.push({name:cleanN, category:guessCategory(cleanN), qty:qty, unit:unit, buyPrice:buy, price:price, vat:vat});
        });
        if(!res.length) throw new Error('Tabulka neobsahuje žádné položky.');
        IMP = res; R();
      }catch(err){ st.textContent = 'Chyba souboru: ' + err.message; }
    };
    r.readAsArrayBuffer(file);
  } else if(ext === 'pdf'){
    var r = new FileReader();
    r.onload = async function(ev){
      try{
        if(STORE.geminiKey){
          st.textContent = '✨ AI analyzuje PDF doklad…';
          var b64 = arrayBufferToBase64(ev.target.result);
          var items = await parseWithGemini(b64, 'application/pdf', '');
          if(items && items.length){ IMP = items; R(); return; }
        }
        st.textContent = 'Extrahuji text z PDF…';
        if(typeof pdfjsLib === 'undefined') throw new Error('Knihovna PDF.js se nenačetla.');
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        var pdf = await pdfjsLib.getDocument({data: ev.target.result}).promise;
        var fullText = '';
        for(var p=1; p<=pdf.numPages; p++){
          var page = await pdf.getPage(p);
          var tc = await page.getTextContent();
          // Seřadit textové prvky odshora dolů (Y sestupně s tolerancí 4pt) a zleva doprava (X vzestupně)
          var items = tc.items.filter(function(it){ return it.str && it.str.trim(); }).map(function(it){
            return { str: it.str.trim(), x: it.transform[4], y: it.transform[5], w: it.width || 0 };
          });
          items.sort(function(a, b){
            if(Math.abs(a.y - b.y) > 4.5) return b.y - a.y;
            return a.x - b.x;
          });
          var rows = [];
          items.forEach(function(it){
            var r = rows.find(function(row){ return Math.abs(row.y - it.y) <= 4.5; });
            if(!r){ r = { y: it.y, cells: [] }; rows.push(r); }
            r.cells.push(it);
          });
          rows.forEach(function(r){
            r.cells.sort(function(a, b){ return a.x - b.x; });
            var line = '';
            r.cells.forEach(function(c, idx){
              if(idx > 0){
                var prev = r.cells[idx-1];
                var gap = c.x - (prev.x + prev.w);
                line += (gap > 14 ? '\t' : ' ');
              }
              line += c.str;
            });
            fullText += line + '\n';
          });
        }
        if(!fullText.trim()) throw new Error('PDF je pravděpodobně naskenovaný obrázek bez textové vrstvy. Vyfoťte ho nebo vložte bezplatný Gemini API klíč v Nastavení.');
        var parsed = smartExtractItemsFromText(fullText, defVat);
        if(!parsed.length){
          document.getElementById('it').value = fullText.trim();
          throw new Error('Text z PDF byl vložen do pole níže – upravte řádky a klikněte na Zpracovat.');
        }
        IMP = parsed; R();
      }catch(err){ st.textContent = 'Chyba PDF: ' + err.message; }
    };
    r.readAsArrayBuffer(file);
  } else if(file.type.indexOf('image/') === 0 || ['jpg','jpeg','png','webp','heic'].indexOf(ext) > -1){
    compressImage(file, 1600, 0.85, async function(dataUrl){
      try{
        if(STORE.geminiKey){
          st.textContent = '✨ AI Vision čte položky z fotografie…';
          var b64 = dataUrl.split(',')[1];
          var mime = dataUrl.split(';')[0].split(':')[1];
          var items = await parseWithGemini(b64, mime, '');
          if(items && items.length){ IMP = items; R(); return; }
        }
        st.textContent = '🔍 Spouštím lokální OCR rozpoznávání textu z obrázku (chvilku strpení)…';
        if(typeof Tesseract === 'undefined') throw new Error('OCR knihovna se nenačetla.');
        var res = await Tesseract.recognize(dataUrl, 'ces+eng', {
          logger: function(m){ if(m.status==='recognizing text') st.textContent = '🔍 Čtu text z fotky: ' + Math.round((m.progress||0)*100) + ' %'; }
        });
        var ocrText = (res && res.data && res.data.text) || '';
        var parsed = smartExtractItemsFromText(ocrText, defVat);
        if(!parsed.length){
          document.getElementById('it').value = ocrText.trim();
          throw new Error('OCR přečetlo text (vložen níže), ale nerozpoznalo strukturu tabulky. Pro 100% přesné čtení fotek vložte v Nastavení bezplatný Gemini API klíč.');
        }
        IMP = parsed; R();
      }catch(err){ st.textContent = 'Upozornění: ' + err.message; }
    });
  } else {
    var r = new FileReader();
    r.onload = function(ev){ document.getElementById('it').value = ev.target.result; impParseText(); };
    r.readAsText(file);
  }
}

function arrayBufferToBase64(buffer){
  var binary = '', bytes = new Uint8Array(buffer), len = bytes.byteLength;
  for(var i=0; i<len; i++) binary += String.fromCharCode(bytes[i]);
  return window.btoa(binary);
}

async function parseWithGemini(base64Data, mimeType, rawText){
  var defVat = C().vatPayer==='ne' ? 0 : 21;
  var prompt = 'Jsi účetní a skladový asistent. Z přiloženého dodacího listu nebo faktury vyčti všechny položky zboží. Vrať POUZE čisté JSON pole objektů ve formátu: [{"name": "název položky", "category": "Jednorázové e-cigarety | Předplněné pody / Cartridge | Sety e-cigaret & Pod systémy | Liquidy | Bez nikotinu (0 mg) | Nikotinové sáčky & Tabák | Baterie & Příslušenství | Ostatní", "qty": 10, "unit": "ks", "buyPrice": 95.0, "price": 110.0, "vat": 21}]. Pravidla: Z názvu produktu vždy odstraň marketingové štítky jako AKCE, SLEVA, VÝPRODEJ, NOVINKA. VENIX NEX, VENIX X2, VENIX PRO, DARK SMOG jsou Jednorázové e-cigarety; VENIX POD, VENIX MAX POD, RELX soMatch POD jsou Předplněné pody / Cartridge. buyPrice je nákupní jednotková cena bez DPH z dokladu; price nastav stejnou nebo o 20% vyšší pokud není uvedena prodejní; vat je sazba DPH (0, 12 nebo 21, výchozí '+defVat+'). Nevracej žádný markdown ani komentáře, jen JSON pole.';
  var parts = [{text: prompt}];
  if(base64Data) parts.push({inline_data: {mime_type: mimeType, data: base64Data}});
  if(rawText) parts.push({text: rawText});
  var res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=' + encodeURIComponent(STORE.geminiKey), {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({contents: [{parts: parts}], generationConfig: {temperature: 0.1}})
  });
  if(!res.ok) throw new Error('Gemini API chyba (' + res.status + ')');
  var data = await res.json();
  var out = data.candidates[0].content.parts[0].text.replace(/```json|```/g,'').trim();
  var arr = JSON.parse(out);
  return (Array.isArray(arr) ? arr : []).map(function(x){
    return {
      name: cleanProductName(x.name),
      category: String(x.category||guessCategory(x.name)).trim(),
      qty: parseFloat(x.qty)||1,
      unit: String(x.unit||'ks').trim(),
      buyPrice: parseFloat(x.buyPrice)||0,
      price: parseFloat(x.price)||parseFloat(x.buyPrice)||0,
      vat: x.vat!==undefined ? (parseFloat(x.vat)||0) : defVat
    };
  }).filter(function(x){return x.name});
}


function cleanProductName(name){
  var s = String(name||'')
    // Odstranit úvodní čísla/částky (např. "4 400,00 924,00 VENIX..." -> "VENIX...")
    .replace(/^[\d\s.,%-]+(?=[A-Za-zÁČĎÉĚÍŇÓŘŠŤÚŮÝŽáčďéěíňóřšťúůýž])/g, '')
    // Odstranit koncové částky/čísla (např. "...Grape-X 4 400,00 924,00")
    .replace(/\s+\d{1,3}(?:[\s\u00a0]\d{3})*[.,]\d{2,4}(?:\s+[\d\s\u00a0.,%-]+)?$/g, '')
    // Odstranit marketingové štítky
    .replace(/\b(AKCE|SLEVA|VÝPRODEJ|VYPRODEJ|NOVINKA|TIP|BLACK\s*FRIDAY|PROMO|ZDARMA|1\+1)\b/gi, '')
    .replace(/\(\s*\)/g, '')
    .replace(/^[-–—:|]+\s*|\s*[-–—:|]+$/g, '')
    .replace(/\s{2,}/g, ' ')
    .trim();
  return s;
}

function guessCategory(name){
  var n = String(name||'').toLowerCase();
  if(/\b0\s*mg\b|bez\s*nikotinu|\bzero\b/.test(n)) return 'Bez nikotinu (0 mg)';
  if(/sáčky|sacky|velo|killa|pablo|žvýkací|tabák|snus/.test(n)) return 'Nikotinové sáčky & Tabák';
  if(/liquid|eliquid|e-liquid|nic\s*salt|salt|10\s*ml|báze|booster|elfliq|overdose|kura|kurwa|popic|popič|ti\s*juice|dr\.?\s*vapes/.test(n)) return 'Liquidy';
  if(/starter\s*kit|kit\b|device|zařízení|zarizeni|pod\s*systém|pod\s*system|eclipse|oxva|xlim|ursa|wenax|vaporesso|voopoo/.test(n)) return 'Sety e-cigaret & Pod systémy';
  if(/\bpod\b|\bpody\b|cartridge|somatch|náhradní\s*náplň|hlava|žhavící|coil/.test(n)) return 'Předplněné pody / Cartridge';
  if(/venix\s*(nex|x2|pro)|dark\s*smog|syx\s*bar|elf\s*bar|izy\s*one|vuse\s*go|jednoráz|disposable|e-cigaret/.test(n)) return 'Jednorázové e-cigarety';
  if(/baterie|battery|kabel|nabíječ|pouzdro|obal|stojan|displej/.test(n)) return 'Baterie & Příslušenství';
  return 'Jednorázové e-cigarety';
}

function isPureNoiseLine(line){
  var l = line.trim();
  if(!l) return true;
  // Řádek tvořený jen čísly, mezerami, čárkami, tečkami nebo procenty (např. "4 400,00 924,00 5 324,00" nebo "X AKCE")
  if(/^[\d\s\u00a0.,%:-]+$/.test(l)) return true;
  if(/^(Označení dodávky|Počet m\.\s*j\.|Cena za m\.j\.|DPH %|Bez DPH|Celkem|Množství|Jedn\.|Sazba DPH|Základ|Výše DPH|Vystavil|Vystaveno|Strana)/i.test(l)) return true;
  return false;
}

function smartExtractItemsFromText(txt, defVat){
  var workTxt = txt;
  var startIdx = workTxt.search(/Označení dodávky|Položka|Název zboží|Fakturujeme Vám/i);
  if(startIdx > -1) workTxt = workTxt.slice(startIdx);
  var endIdx = workTxt.search(/Sazba DPH\s+Základ|Celkem k úhradě|REKAPITULACE DPH|Vystavil:|Vystaveno v online/i);
  if(endIdx > -1) workTxt = workTxt.slice(0, endIdx);

  var rawLines = workTxt.split(/\r?\n/).map(function(l){return l.trim()}).filter(function(l){return !isPureNoiseLine(l);});
  var res = [];
  var pendingPrefix = '';

  for(var i = 0; i < rawLines.length; i++){
    var line = rawLines[i];

    // Hledáme kotvu: [Množství] [Jednotka] [Jednotková cena] (např. "44,0 ks 100,0000")
    var anchor = line.match(/^(.*?)\s+(\d+(?:[.,]\d+)?)\s*(ks|bal|kart|kg|l|m|hod|sada)\s+(\d{1,3}(?:[\s\u00a0]\d{3})*(?:[.,]\d+)?|\d+(?:[.,]\d+)?)(?:\s+(0|12|21)(?:\s*%)?)?(?:\s+[\d\s\u00a0.,]+)?$/i);

    if(anchor){
      var inlineName = anchor[1].replace(/\t+/g, ' ').trim();
      var qty = parseFloat(anchor[2].replace(',', '.')) || 1;
      var unit = anchor[3] || 'ks';
      var unitPrice = parseFloat(anchor[4].replace(/[\s\u00a0]/g, '').replace(',', '.')) || 0;
      var vat = anchor[5] !== undefined ? parseFloat(anchor[5]) : defVat;

      var fullName = (pendingPrefix ? pendingPrefix + ' ' : '') + inlineName;
      pendingPrefix = '';

      // Podívat se na bezprostředně následující řádek, jestli tam nepřetekl konec názvu (např. "X AKCE" pod "NEX Cherry Grape-")
      if(i + 1 < rawLines.length){
        var nextL = rawLines[i + 1];
        var nextHasAnchor = /(\d+(?:[.,]\d+)?)\s*(ks|bal|kart|kg|l|m|hod|sada)\s+\d/i.test(nextL);
        if(!nextHasAnchor && nextL.length <= 25 && /[A-Za-zÁČĎÉĚÍŇÓŘŠŤÚŮÝŽáčďéěíňóřšťúůýž]/.test(nextL) && !/\d{2,}[.,]\d{2}/.test(nextL)){
          fullName += (fullName.endsWith('-') ? '' : ' ') + nextL;
          i++; // přeskočit zkonzumovaný řádek
        }
      }

      var cleanN = cleanProductName(fullName);
      if(cleanN && /[A-Za-zÁČĎÉĚÍŇÓŘŠŤÚŮÝŽáčďéěíňóřšťúůýž]{2,}/.test(cleanN)){
        res.push({
          name: cleanN,
          category: guessCategory(cleanN),
          qty: qty,
          unit: unit,
          buyPrice: unitPrice,
          price: unitPrice,
          vat: vat
        });
      }
    } else if(line.indexOf('\t') > -1 || line.indexOf(';') > -1){
      // Tabulkový řádek z Excelu / CSV
      var sep = line.indexOf('\t') > -1 ? '\t' : ';';
      var p = line.split(sep).map(function(s){return s.trim()});
      var cleanN = cleanProductName(p[0]);
      if(cleanN && p.length >= 2 && /[A-Za-zÁČĎÉĚÍŇÓŘŠŤÚŮÝŽáčďéěíňóřšťúůýž]{2,}/.test(cleanN)){
        var q = parseFloat(String(p[1]).replace(',', '.')) || 1;
        var unit = (isNaN(parseFloat(p[2])) && p[2] ? p[2] : 'ks');
        var pr = parseFloat(String(p[3]||p[2]||'0').replace(/[\s\u00a0]/g, '').replace(',', '.').replace(/[^\d.-]/g, '')) || 0;
        var v = p[4] !== undefined && !isNaN(parseFloat(p[4])) ? parseFloat(p[4]) : defVat;
        res.push({name: cleanN, category: guessCategory(cleanN), qty: q, unit: unit, buyPrice: pr, price: pr, vat: v});
      }
      pendingPrefix = '';
    } else {
      // Čistě textový řádek bez částek -> uložit jako prefix pro další řádek (např. "VENIX" před "NEX Grape-X 44,0 ks ...")
      if(line.length <= 45 && /[A-Za-zÁČĎÉĚÍŇÓŘŠŤÚŮÝŽáčďéěíňóřšťúůýž]/.test(line) && !/\d{2,}[.,]\d{2}/.test(line)){
        pendingPrefix = (pendingPrefix ? pendingPrefix + ' ' : '') + line;
      } else {
        pendingPrefix = '';
      }
    }
  }
  return res;
}

async function impParseText(){
  var txt = document.getElementById('it').value.trim(), st = document.getElementById('is');
  if(!txt){ st.textContent = 'Vložte nejprve text.'; return; }
  var defVat = C().vatPayer==='ne'?0:21;
  if(STORE.geminiKey){
    try{
      st.textContent = '✨ AI parsuje položky z textu…';
      var aiRes = await parseWithGemini(null, null, txt);
      if(aiRes && aiRes.length){ IMP = aiRes; R(); return; }
    }catch(err){}
  }
  var res = smartExtractItemsFromText(txt, defVat);
  if(!res.length){ st.textContent = 'Nepodařilo se rozpoznat řádky. Použijte formát: Název ; Množství ; Jednotka ; Cena'; return; }
  IMP = res; R();
}
function impAdd(){
  IMP.forEach(function(it){
    var cat = it.category || guessCategory(it.name);
    var s = D().stock.filter(function(x){return x.name.toLowerCase()===it.name.toLowerCase()})[0];
    if(s) wr('stock', Object.assign({}, s, {
      qty: Math.round((s.qty + it.qty)*1000)/1000,
      buyPrice: it.buyPrice || s.buyPrice || 0,

  });

}

function matchPaymentsList(txList){
  bankLog = [];
  var matchedCount = 0;
  txList.forEach(function(tx){
    if(tx.amount <= 0) return;
    var vsClean = String(tx.vs || '').replace(/^0+/, '');
    if(!vsClean){
      bankLog.push({date: tx.date, info: tx.info, vs: '', amount: tx.amount, matched: false, status: 'Bez VS'});
      return;
    }
    var inv = D().invoices.find(function(i){
      var ivs = String(i.vs || i.number || '').replace(/\D/g, '').replace(/^0+/, '');
      return ivs === vsClean && i.status !== 'paid';
    });
    if(inv){
      var invTot = Math.round(calc(inv).t * 100) / 100;
      if(Math.abs(invTot - tx.amount) <= 2){
        inv.status = 'paid';
        inv.paidDate = tx.date || today();
        matchedCount++;
        bankLog.push({date: tx.date, info: tx.info || inv.client, vs: vsClean, amount: tx.amount, matched: true, status: 'Spárováno → Faktura ' + inv.number});
      } else {
        bankLog.push({date: tx.date, info: tx.info || inv.client, vs: vsClean, amount: tx.amount, matched: false, status: 'Nesouhlasí částka (faktura ' + money(invTot) + ')'});
      }
    } else {
      bankLog.push({date: tx.date, info: tx.info, vs: vsClean, amount: tx.amount, matched: false, status: 'Nenalezena otevřená faktura'});
    }
  });
  if(matchedCount > 0) saveStore();
  R();
  alert('Párování dokončeno. Automaticky označeno jako zaplaceno: ' + matchedCount + ' faktur.');
}

async function syncFioPayments(){
  var st = document.getElementById('fioStatus');
  if(!STORE.fioToken) return;
  st.textContent = 'Připojuji se k Fio Bance…';
  try{
    var dFrom = today(-30), dTo = today();
    var url = 'https://fioapi.fio.cz/v1/rest/periods/' + encodeURIComponent(STORE.fioToken) + '/' + dFrom + '/' + dTo + '/transactions.json';
    var res = await fetch(url);
    if(!res.ok) throw new Error('Chyba Fio API (' + res.status + '). Zkontrolujte platnost tokenu.');
    var data = await res.json();
    var txs = ((data.accountStatement && data.accountStatement.transactionList && data.accountStatement.transactionList.transaction) || []).map(function(t){
      return {
        date: t.column0 ? String(t.column0.value).slice(0,10) : today(),
        amount: t.column1 ? Number(t.column1.value) : 0,
        vs: t.column5 ? String(t.column5.value) : '',
        info: (t.column10 ? t.column10.value : '') || (t.column7 ? t.column7.value : 'Příchozí platba')
      };
    });
    matchPaymentsList(txs);
  }catch(err){
    st.textContent = 'Chyba: ' + err.message + ' (Pozn.: Některé prohlížeče blokují přímé CORS volání na Fio – v tom případě použijte stažení CSV/GPC výpisu níže).';
  }
}

function handleBankFile(file){
  if(!file) return;
  var r = new FileReader();
  r.onload = function(ev){
    var txt = ev.target.result;
    var lines = txt.split(/?
/), txs = [];
    // GPC formát (řádky začínají 075)
    if(lines.some(function(l){ return l.indexOf('075') === 0; })){
      lines.forEach(function(l){
        if(l.indexOf('075') === 0 && l.length >= 90){
          var typ = l.slice(60, 61); // 2 = kredit (příchozí platba)
          var halere = parseInt(l.slice(48, 60), 10) || 0;
          var vs = l.slice(61, 71).replace(/^0+/, '');
          var dStr = l.slice(122, 128); // DDMMRR
          var dt = dStr.length===6 ? ('20'+dStr.slice(4,6)+'-'+dStr.slice(2,4)+'-'+dStr.slice(0,2)) : today();
          if(typ === '2' || typ === '5'){
            txs.push({date: dt, amount: halere / 100, vs: vs, info: l.slice(97, 117).trim() || 'GPC platba'});
          }
        }
      });
    } else {
      // CSV výpis
      lines.forEach(function(l, idx){
        if(idx === 0 || !l.trim()) return;
        var sep = l.indexOf(';') > -1 ? ';' : ',';
        var cols = l.split(sep).map(function(c){ return c.replace(/^"|"$/g,'').trim(); });
        var amount = 0, vs = '', dt = today(), info = '';
        cols.forEach(function(c){
          if(/^\d{1,2}\.\d{1,2}\.\d{4}$/.test(c)){
            var p = c.split('.'); dt = p[2]+'-'+p[1].padStart(2,'0')+'-'+p[0].padStart(2,'0');
          } else if(/^-?\d+(?:[.,]\d{2})$/.test(c.replace(/\s/g,'')) && !amount){
            amount = parseFloat(c.replace(/\s/g,'').replace(',','.'));
          } else if(/^\d{4,10}$/.test(c) && !vs){
            vs = c;
          } else if(c.length > 3 && !info){
            info = c;
          }
        });
        if(amount > 0) txs.push({date: dt, amount: amount, vs: vs, info: info || 'CSV platba'});
      });
    }
    if(!txs.length){ alert('V souboru nebyly nalezeny žádné příchozí platby.'); return; }
    matchPaymentsList(txs);
  };
  r.readAsText(file, 'windows-1250');
}

  '<div class="card"><h2>Doklady připravené k exportu</h2>'+(l.length?'<div class="w"><table><thead><tr><th>Číslo</th><th>Odběratel</th><th>Vystaveno</th><th class="r">Základ</th><th class="r">DPH</th><th class="r">Celkem</th></tr></thead><tbody>'+rows+'</tbody></table></div>':'<p class="mu">Žádné faktury k exportu.</p>')+'</div>';
}
function expRun(){
  var l = expList(); if(!l.length) return;
  var xml = pohodaXml(l), fn = 'pohoda_'+(C().ico||'firma')+'_'+(EX.mode==='month'?EX.mon:today())+'.xml';
  downloadFile(fn, xml, 'application/xml');
  l.forEach(function(i){ wr('invoices', Object.assign({}, i, {exported: today()})); });
}
function downloadFile(filename, content, mime){
  var blob = new Blob([content], {type: mime || 'text/plain;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
}
function xe(x){return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function r2(n){return Math.round(n*100)/100}
function addrParse(a){a=String(a||'');var m=a.match(/^(.*?),\s*(\d{3}\s?\d{2})\s+(.+)$/);return m?{street:m[1],zip:m[2].replace(/\s/g,''),city:m[3]}:{street:a,zip:'',city:''}}
function acct(iban){iban=String(iban||'').replace(/\s/g,'').toUpperCase();if(/^CZ\d{22}$/.test(iban)){var pre=iban.slice(8,14).replace(/^0+/,''),no=iban.slice(14).replace(/^0+/,'');return {no:(pre?pre+'-':'')+no,code:iban.slice(4,8)}}return null}
function pohodaXml(list){
  var c=C(), ac=acct(c.iban);
  var x='<?xml version="1.0" encoding="UTF-8"?>\n<dat:dataPack id="DOK'+Date.now()+'" ico="'+xe(c.ico)+'" application="Dokladoid" version="2.0" note="Export vydaných faktur" xmlns:dat="http://www.stormware.cz/schema/version_2/data.xsd" xmlns:inv="http://www.stormware.cz/schema/version_2/invoice.xsd" xmlns:typ="http://www.stormware.cz/schema/version_2/type.xsd">\n';
  list.forEach(function(i,n){
    var g={none:{z:0,d:0},low:{z:0,d:0},high:{z:0,d:0}}, ad=addrParse(i.caddr);
    var items=i.items.map(function(it){
      var k=it.vat>=18?'high':it.vat>0?'low':'none';
      g[k].z+=it.qty*it.price; g[k].d+=it.qty*it.price*it.vat/100;
      return '<inv:invoiceItem><inv:text>'+xe(String(it.name).slice(0,90))+'</inv:text><inv:quantity>'+it.qty+'</inv:quantity><inv:unit>'+xe(it.unit)+'</inv:unit><inv:payVAT>false</inv:payVAT><inv:rateVAT>'+k+'</inv:rateVAT><inv:homeCurrency><typ:unitPrice>'+it.price+'</typ:unitPrice></inv:homeCurrency></inv:invoiceItem>';
    }).join('\n');
    x+='<dat:dataPackItem id="F'+(n+1)+'" version="2.0"><inv:invoice version="2.0"><inv:invoiceHeader>'+
     '<inv:invoiceType>issuedInvoice</inv:invoiceType><inv:number><typ:numberRequested>'+xe(i.number)+'</typ:numberRequested></inv:number>'+
     '<inv:symVar>'+xe(String(i.vs||i.number).replace(/\D/g,'').slice(0,20))+'</inv:symVar><inv:date>'+xe(i.issue)+'</inv:date><inv:dateTax>'+xe(i.duzp||i.issue)+'</inv:dateTax><inv:dateAccounting>'+xe(i.issue)+'</inv:dateAccounting><inv:dateDue>'+xe(i.due)+'</inv:dateDue>'+
     '<inv:text>Fakturujeme Vám</inv:text><inv:paymentType><typ:paymentType>draft</typ:paymentType></inv:paymentType>'+
     (ac?'<inv:account><typ:accountNo>'+xe(ac.no)+'</typ:accountNo><typ:bankCode>'+ac.code+'</typ:bankCode></inv:account>':'')+
     '<inv:partnerIdentity><typ:address><typ:company>'+xe(i.client)+'</typ:company><typ:city>'+xe(ad.city)+'</typ:city><typ:street>'+xe(ad.street)+'</typ:street><typ:zip>'+xe(ad.zip)+'</typ:zip><typ:ico>'+xe(i.cico)+'</typ:ico><typ:dic>'+xe(i.cdic)+'</typ:dic></typ:address></inv:partnerIdentity>'+
     '</inv:invoiceHeader><inv:invoiceDetail>\n'+items+'\n</inv:invoiceDetail><inv:invoiceSummary><inv:roundingDocument>none</inv:roundingDocument><inv:homeCurrency>'+
     '<typ:priceNone>'+r2(g.none.z)+'</typ:priceNone><typ:priceLow>'+r2(g.low.z)+'</typ:priceLow><typ:priceLowVAT>'+r2(g.low.d)+'</typ:priceLowVAT><typ:priceLowSum>'+r2(g.low.z+g.low.d)+'</typ:priceLowSum>'+
     '<typ:priceHigh>'+r2(g.high.z)+'</typ:priceHigh><typ:priceHighVAT>'+r2(g.high.d)+'</typ:priceHighVAT><typ:priceHighSum>'+r2(g.high.z+g.high.d)+'</typ:priceHighSum>'+
     '</inv:homeCurrency></inv:invoiceSummary></inv:invoice></dat:dataPackItem>\n';
  });
  return x+'</dat:dataPack>\n';
}

  (icoMsg?'<p class="mu">'+e(icoMsg)+'</p>':'')+
  '</div>'+

  '<div class="card"><h2>🤖 AI skenování dokladů (Fotoaparát & PDF – volitelné)</h2>'+
    '<p class="mu">Pro 100% přesné automatické vyčtení položek z vyfocených dodacích listů, faktur a naskenovaných PDF vložte bezplatný API klíč z <b>Google AI Studio</b> (aistudio.google.com). Bez klíče funguje lokální čtečka textových PDF a základní OCR.</p>'+
    '<div class="row"><input type="password" id="gemKeyInput" style="flex:1;min-width:220px" placeholder="AIzaSy..." value="'+e(STORE.geminiKey||'')+'"><button class="b" onclick="saveGemKey()">Uložit API klíč</button></div>'+
  '</div>'+

  '<div class="card"><h2>☁️ Sdílená databáze v reálném čase (pro 3 uživatele)</h2>'+
    '<p class="mu">Vložte URL vaší bezplatné databáze <b>Firebase Realtime Database</b> (ve tvaru <code>{"databaseURL": "https://vas-projekt.firebaseio.com"}</code>) pro živé sdílení mezi všemi 3 uživateli.</p>'+
    '<textarea id="fbCfgInput" style="width:100%;min-height:68px;font-family:monospace;font-size:12.5px" placeholder=\'{"databaseURL": "https://muj-dokladoid-default-rtdb.europe-west1.firebasedatabase.app"}\'>'+e(STORE.fbConfig||'')+'</textarea>'+
    '<div class="row" style="margin-top:10px"><button class="b" onclick="saveFbConfig()">Připojit sdílenou databázi</button><button class="g" onclick="pullCloud(false)">🔄 Synchronizovat hned</button></div>'+

      '<div><label>Minimální odběr (ks)</label><input type="number" value="'+(STORE.promoBuyQty||80)+'" onchange="STORE.promoBuyQty=parseInt(this.value)||80;saveStore()"></div>'+
      '<div><label>Počet kusů zdarma navíc</label><input type="number" value="'+(STORE.promoFreeQty||8)+'" onchange="STORE.promoFreeQty=parseInt(this.value)||8;saveStore()"></div>'+

    ((STORE.snapshots && STORE.snapshots.length) ? '<div class="row" style="margin-bottom:12px"><select id="snapSel" style="flex:1;min-width:200px">'+STORE.snapshots.map(function(s,idx){ return '<option value="'+idx+'">Záloha ze dne '+e(s.date)+' (uložil: '+e(s.by||'—')+')</option>'; }).join('')+'</select><button class="g" onclick="restoreSnapshot()">⏪ Obnovit vybraný den</button></div>' : '')+

function restoreSnapshot(){
  var idx = parseInt(document.getElementById('snapSel').value, 10);
  var snap = STORE.snapshots && STORE.snapshots[idx];
  if(!snap) return;
  if(!confirm('Opravdu chcete obnovit stav databáze ze dne ' + snap.date + '? Aktuální neuložené změny budou nahrazeny.')) return;
  try{
    var parsed = JSON.parse(snap.payload);
    STORE.profiles = parsed.profiles;
    STORE.data = parsed.data;
    saveStore();
    R();
    alert('Data byla úspěšně obnovena ze zálohy ze dne ' + snap.date + '.');
  }catch(e){ alert('Chyba při obnově zálohy.'); }
}

function uploadLogo(file){
  if(!file) return;
  compressImage(file, 420, 0.85, function(dataUrl){
    wrP('logo', dataUrl);
    R();
  });
}

function saveGemKey(){
  STORE.geminiKey = document.getElementById('gemKeyInput').value.trim();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(STORE));
  alert(STORE.geminiKey ? 'Gemini API klíč uložen. AI Vision skenování fotek a PDF je aktivní.' : 'API klíč odstraněn.');
  R();
}
function saveFbConfig(){
  var val = document.getElementById('fbCfgInput').value.trim();
  STORE.fbConfig = val;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(STORE));
  if(!val){ cloudUrl=''; updateSyncUI(false,'Lokální režim (1 zařízení)'); alert('Cloudová synchronizace odpojena.'); return; }
  initCloud();
  alert('Konfigurace uložena. Zkontrolujte stav připojení v levém bočním panelu.');
}
function exportBackup(){ downloadFile('dokladoid_zaloha_' + today() + '.json', JSON.stringify(STORE, null, 2), 'application/json'); }
function importBackup(file){
  if(!file) return;
  var r = new FileReader();
  r.onload = function(ev){
    try{
      var p = JSON.parse(ev.target.result);
      if(!p.profiles || !p.data) throw new Error('Neplatný soubor.');
      STORE.profiles = p.profiles; STORE.data = p.data;
      saveStore(); alert('Záloha obnovena.'); R();
    }catch(err){ alert('Chyba: ' + err.message); }
  };
  r.readAsText(file);
}

R();
initCloud();
