<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dokladoid</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6df6'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'%3ED%3C/text%3E%3C/svg%3E">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f9;--card:#fff;--tx:#1a2233;--mu:#69758a;--bd:#e4e8f0;--ac:#2f6df6;--ac2:#1e56d8;--acs:#eaf0ff;--dg:#d33b3b;--ok:#15803d;--wn:#b45309;--okb:#e3f6ea;--wnb:#fdf1dc;--dgb:#fde7e7;--side:#111c36;--sidetx:#b7c2da;--sh:0 1px 2px rgba(20,30,60,.05),0 6px 18px rgba(20,30,60,.05);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1219;--card:#171c26;--tx:#e8ecf3;--mu:#94a0b4;--bd:#272e3b;--ac:#5b8def;--ac2:#7aa2f5;--acs:#1c2742;--dg:#ef6a6a;--ok:#6fcf74;--wn:#e8b04a;--okb:#16301e;--wnb:#35290f;--dgb:#3a1a1a;--side:#0a0e16;--sh:0 1px 2px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0e1219;--card:#171c26;--tx:#e8ecf3;--mu:#94a0b4;--bd:#272e3b;--ac:#5b8def;--ac2:#7aa2f5;--acs:#1c2742;--dg:#ef6a6a;--ok:#6fcf74;--wn:#e8b04a;--okb:#16301e;--wnb:#35290f;--dgb:#3a1a1a;--side:#0a0e16;--sh:0 1px 2px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14.5px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:flex;min-height:100vh}
aside{width:236px;flex:none;background:var(--side);color:var(--sidetx);padding:20px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;align-self:flex-start;height:100vh;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:19px;letter-spacing:-.01em}
.lm{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#5b8def,#2f6df6);display:grid;place-items:center;font-size:17px;color:#fff}
aside select{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;font-weight:500;border-radius:10px;padding:9px 10px}
aside select option{color:#111}
nav{display:flex;flex-direction:column;gap:3px}
nav button{display:flex;align-items:center;gap:11px;background:none;border:0;color:var(--sidetx);padding:10px 12px;border-radius:10px;font:inherit;font-weight:500;cursor:pointer;text-align:left}
nav button:hover{background:rgba(255,255,255,.07);color:#fff}
nav button.on{background:var(--ac);color:#fff;box-shadow:0 4px 12px rgba(47,109,246,.35)}
.ic{width:18px;height:18px;flex:none}
.sf{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--sidetx);font-size:13px}
.sf .g{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:#fff;padding:4px 10px}
.mainwrap{flex:1;min-width:0}
main{max-width:1060px;margin:0 auto;padding:28px}
select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 11px;max-width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:var(--sh)}
h2{margin:0 0 14px;font-size:20px;font-weight:700;letter-spacing:-.01em}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
button.b{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(47,109,246,.3)}
button.b:hover{background:var(--ac2)}
button.b:disabled{opacity:.5;cursor:default}
button.g{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:9px;padding:6px 11px;font:inherit;font-weight:500;cursor:pointer}
button.g:hover{background:var(--bg)}
button.d{color:var(--dg)}
.w{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:11.5px;color:var(--mu);text-align:left;font-weight:600;padding:8px;text-transform:uppercase;letter-spacing:.05em}
td{padding:9px 8px;border-top:1px solid var(--bd);vertical-align:middle}
tbody tr:hover,table tr:hover td{background:rgba(127,140,170,.04)}
td input,td select{width:100%;min-width:60px}
.r{text-align:right;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:5px;font-weight:500}
label input,.grid input,.grid textarea{width:100%}
.tot{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;margin-top:16px}
#sum{background:var(--bg);border-radius:12px;padding:14px 18px;min-width:230px}
.qr svg{width:150px;height:150px;background:#fff;border-radius:10px;border:1px solid var(--bd);padding:4px}
.mu{color:var(--mu);font-size:13px}
.bd{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
.bd.ok{background:var(--okb)}.bd.wn{background:var(--wnb)}.bd.dg{background:var(--dgb)}
.ok{color:var(--ok)}.wn{color:var(--wn)}.dg{color:var(--dg)}
.ban{background:var(--wnb);color:var(--wn);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px}
textarea{width:100%;min-height:120px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px 18px;box-shadow:var(--sh)}
.kl{font-size:11.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.kv{font-size:24px;font-weight:700;margin-top:6px;letter-spacing:-.01em}
.bars{display:flex;gap:14px;align-items:flex-end;height:170px;padding-top:6px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:7px}
.bv{width:100%;max-width:60px;background:linear-gradient(var(--ac),var(--ac2));border-radius:8px 8px 0 0;min-height:3px}
.bar span{font-size:12px;color:var(--mu)}
.clk{cursor:pointer}
.dd{position:fixed;z-index:50;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--bd);border-radius:14px;box-shadow:0 16px 40px rgba(10,20,40,.28);max-height:280px;overflow:auto;padding:6px}
.dd .dh{font-size:11.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;font-weight:600;padding:6px 10px}
.dd .it{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:9px 10px;border-radius:9px;cursor:pointer}
.dd .it:hover{background:var(--acs)}
.dd .it small{display:block;color:var(--mu);font-size:12px}
.vs{width:auto!important;min-width:0!important;margin-right:4px}
@media (max-width:820px){
 .app{flex-direction:column}
 aside{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px;gap:10px}
 .logo{flex:1}aside select{width:auto;min-width:150px}
 nav{flex-direction:row;overflow-x:auto;width:100%;order:3;padding-bottom:2px}
 nav button{padding:8px 11px;white-space:nowrap;flex:none}
 main{padding:14px}
}
@media print{.dd,aside,.noprint,.ban{display:none!important}.app{display:block}body{background:#fff;color:#000}.card{border:0;box-shadow:none}input,select{border:0;background:none;color:#000}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="logo"><span class="lm">D</span>Dokladoid</div>
  <select id="co" onchange="switchCo(this.value)" title="Přepnout firmu"></select>
  <nav id="nav"></nav>
  <div class="sf"><span id="who" style="overflow:hidden;text-overflow:ellipsis;max-width:120px"></span><button class="g" onclick="logout()">Odhlásit</button></div>
</aside>
<div class="mainwrap"><main id="app"></main></div>
</div>
<div id="dd" class="dd" hidden></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, setDoc, deleteDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDjvtudcU_ef55K01EG-ZU25Bfyd-CEY_E",
  authDomain: "dokladoid.firebaseapp.com",
  projectId: "dokladoid",
  storageBucket: "dokladoid.firebasestorage.app",
  messagingSenderId: "517848940698",
  appId: "1:517848940698:web:093bdd45bbea73fa151f23",
  measurementId: "G-SWGKN1Y3JC"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.uid = () => Math.random().toString(36).slice(2, 9);
window.e = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
window.today = (d) => new Date(Date.now() + (d || 0) * 864e5).toISOString().slice(0, 10);
window.money = (n) => (Number(n) || 0).toLocaleString('cs-CZ', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' Kč';
function mk(n) { return { name: n, ico: '', dic: '', addr: '', iban: '', bank: '', next: 1, vatPayer: 'ano' }; }

let P = { a: mk('Firma A s.r.o.'), b: mk('Firma B s.r.o.') };
let D = { stock: [], invoices: [], clients: [] };
let A = 'a';
let V = { p: 'dash' };
let cur = null;
let pend = false;
let err = '';
let me = null;
let unsubs = [];
let icoMsg = '';
let EX = { mode: 'month', mon: '', inc: false };

try { A = localStorage.getItem('dokladoid_active') === 'b' ? 'b' : 'a'; } catch (x) {}
function C() { return P[A]; }

/* ---------- Živá synchronizace s Firebase Firestore ---------- */
function clearSubs() {
  unsubs.forEach(u => { try { u(); } catch (x) {} });
  unsubs = [];
}

function startSync() {
  clearSubs();
  ['a', 'b'].forEach(k => {
    unsubs.push(onSnapshot(doc(db, 'profiles', k), snap => {
      if (snap.exists()) P[k] = Object.assign(mk(''), snap.data());
      rr();
    }, x => er(x)));
  });
  ['stock', 'invoices', 'clients'].forEach(kind => {
    unsubs.push(onSnapshot(collection(db, 'cos_' + A + '_' + kind), snap => {
      D[kind] = snap.docs.map(d => Object.assign({}, d.data(), { id: d.id }));
      err = '';
      rr();
    }, x => er(x)));
  });
}

function showLogin() {
  document.getElementById('nav').innerHTML = '';
  document.getElementById('co').innerHTML = '';
  document.getElementById('who').textContent = '';
  document.getElementById('app').innerHTML = `
    <div class="card" style="max-width:360px;margin:60px auto">
      <h2>Přihlášení do Dokladoid</h2>
      <label>E-mail</label>
      <input id="lu" type="email" autocomplete="username">
      <label style="margin-top:10px">Heslo</label>
      <input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
      <div class="mu dg" id="le" style="margin:8px 0;min-height:18px"></div>
      <button class="b" onclick="doLogin()">Přihlásit</button>
    </div>`;
}

window.doLogin = async function() {
  const email = document.getElementById('lu').value.trim();
  const pw = document.getElementById('lp').value;
  document.getElementById('le').textContent = 'Přihlašuji…';
  try {
    await signInWithEmailAndPassword(auth, email, pw);
  } catch (x) {
    document.getElementById('le').textContent = 'Neplatný e-mail nebo heslo (' + x.code + ').';
  }
};

window.logout = async function() {
  clearSubs();
  await signOut(auth);
};

onAuthStateChanged(auth, user => {
  if (!user) {
    me = null;
    clearSubs();
    showLogin();
    return;
  }
  me = user.email;
  document.getElementById('who').textContent = me.split('@')[0];
  R();
  startSync();
});

function er(x) {
  err = (x && x.message) || 'Chyba spojení s databází';
  rr();
}
function isIn() {
  const a = document.activeElement;
  return a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName);
}
function rr() {
  if (V.p === 'edit' || V.p === 'imp' || isIn()) { pend = true; return; }
  pend = false;
  R();
}
document.addEventListener('focusout', () => { setTimeout(() => { if (pend && !isIn()) rr(); }, 60); });

function wr(n, o) {
  o = JSON.parse(JSON.stringify(o));
  const id = o.id;
  delete o.id;
  setDoc(doc(db, 'cos_' + A + '_' + n, id), o).catch(er);
}
function rm(n, id) {
  deleteDoc(doc(db, 'cos_' + A + '_' + n, id)).catch(er);
}
function wrP(k, v) {
  P[A][k] = v;
  setDoc(doc(db, 'profiles', A), JSON.parse(JSON.stringify(P[A]))).catch(er);
}
function find(n, id) { return D[n].filter(x => x.id === id)[0]; }
function srt(a, k) { return a.slice().sort((x, y) => String(x[k]).localeCompare(String(y[k]), 'cs')); }

window.go = function(p, id) {
  V = { p: p, id: id };
  icoMsg = '';
  if (p === 'edit') cur = id ? JSON.parse(JSON.stringify(find('invoices', id))) : newInv();
  R();
  window.scrollTo(0, 0);
};
window.switchCo = function(id) {
  A = id;
  try { localStorage.setItem('dokladoid_active', A); } catch (x) {}
  V = { p: 'dash' };
  D = { stock: [], invoices: [], clients: [] };
  R();
  if (me) startSync();
};

function blank() { return { name: '', qty: 1, unit: 'ks', price: 0, vat: C().vatPayer === 'ne' ? 0 : 21 }; }
function newInv() {
  const y = new Date().getFullYear();
  const n = '' + y + String(C().next).padStart(4, '0');
  return { id: uid(), number: n, vs: n, client: '', cico: '', cdic: '', caddr: '', issue: today(), due: today(14), items: [blank()], status: 'open', deduct: true, deducted: false, isNew: true };
}
function calc(inv) {
  let z = 0, d = 0;
  (inv.items || []).forEach(it => { const l = it.qty * it.price; z += l; d += l * it.vat / 100; });
  return { z: z, d: d, t: z + d };
}
function stOf(i) { return i.status === 'paid' ? ['Zaplaceno', 'ok'] : (i.due && i.due < today() ? ['Po splatnosti', 'dg'] : ['Nezaplaceno', 'wn']); }

const ICO = {
  exp: '<path d="M14 2H6v20h12V8z"/><path d="M14 2v6h6M12 18v-6M9 15l3 3 3-3"/>',
  dash: '<rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>',
  inv: '<path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6M9 13h8M9 17h8"/>',
  stock: '<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  cli: '<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-7 7-7s7 3 7 7M17 4a4 4 0 010 8M22 21c0-3-2-5-4-6"/>',
  imp: '<path d="M12 3v12M7 10l5 5 5-5M4 21h16"/>',
  set: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'
};
function ic(k) { return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + ICO[k] + '</svg>'; }

window.R = function() {
  if (!me) return;
  const cs = document.getElementById('co');
  cs.innerHTML = ['a', 'b'].map(k => '<option value="' + k + '"' + (k === A ? ' selected' : '') + '>' + e(P[k].name) + '</option>').join('');
  const tabs = [['dash', 'Přehled'], ['inv', 'Faktury'], ['stock', 'Sklad'], ['cli', 'Odběratelé'], ['imp', 'Import na sklad'], ['exp', 'Export Pohoda'], ['set', 'Nastavení']];
  document.getElementById('nav').innerHTML = tabs.map(t => '<button class="' + ((V.p === t[0] || (V.p === 'edit' && t[0] === 'inv')) ? 'on' : '') + '" onclick="go(\'' + t[0] + '\')">' + ic(t[0]) + '<span>' + t[1] + '</span></button>').join('');
  const ban = err ? '<div class="ban">' + e(err) + '</div>' : '';
  document.getElementById('app').innerHTML = ban + (V.p === 'dash' ? vDash() : V.p === 'inv' ? vInv() : V.p === 'edit' ? vEdit() : V.p === 'stock' ? vStock() : V.p === 'cli' ? vCli() : V.p === 'imp' ? vImp() : V.p === 'exp' ? vExp() : vSet());
  if (V.p === 'edit') upd();
};

function vDash() {
  let inv = D.invoices, op = 0, od = 0, pd = 0, t = today(), now = new Date(), mo = [];
  inv.forEach(i => { const v = calc(i).t; if (i.status === 'paid') pd += v; else { op += v; if (i.due && i.due < t) od += v; } });
  for (let k = 5; k >= 0; k--) { const d = new Date(now.getFullYear(), now.getMonth() - k, 1); mo.push({ key: d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'), lb: d.toLocaleString('cs-CZ', { month: 'short' }), v: 0 }); }
  inv.forEach(i => { const m = mo.filter(x => x.key === String(i.issue || '').slice(0, 7))[0]; if (m) m.v += calc(i).t; });
  const mx = Math.max.apply(null, mo.map(x => x.v).concat([1])), low = D.stock.filter(s => s.qty <= 0).length;
  function kp(l, v, c) { return '<div class="kpi"><div class="kl">' + l + '</div><div class="kv ' + (c || '') + '">' + v + '</div></div>'; }
  const rec = srt(inv, 'number').reverse().slice(0, 5).map(i => { const s = stOf(i); return '<tr class="clk" onclick="go(\'edit\',\'' + i.id + '\')"><td><b>' + e(i.number) + '</b></td><td>' + e(i.client || '—') + '</td><td><span class="bd ' + s[1] + '">' + s[0] + '</span></td><td class="r">' + money(calc(i).t) + '</td></tr>'; }).join('');
  return '<div class="row" style="margin-bottom:16px"><h2 class="sp" style="margin:0">Přehled – ' + e(C().name) + '</h2><button class="b" onclick="go(\'edit\')">+ Nová faktura</button></div>' +
    remBox() + '<div class="kpis">' + kp('Neuhrazeno', money(op)) + kp('Po splatnosti', money(od), od > 0 ? 'dg' : '') + kp('Zaplaceno', money(pd), 'ok') + kp('Položky bez zásob', low, low ? 'wn' : '') + '</div>' +
    '<div class="card"><h2 style="font-size:16px">Fakturace za posledních 6 měsíců</h2><div class="bars">' + mo.map(x => '<div class="bar" title="' + money(x.v) + '"><div class="bv" style="height:' + Math.round(x.v / mx * 100) + '%"></div><span>' + x.lb + '</span></div>').join('') + '</div></div>' +
    '<div class="card"><h2 style="font-size:16px">Poslední faktury</h2>' + (rec ? '<div class="w"><table><tr><th>Číslo</th><th>Odběratel</th><th>Stav</th><th class="r">Celkem</th></tr>' + rec + '</table></div>' : '<p class="mu">Zatím žádné faktury.</p>') + '</div>';
}

function vInv() {
  const rows = srt(D.invoices, 'number').reverse().map(i => {
    const s = stOf(i), pd = i.status === 'paid';
    return '<tr><td><b>' + e(i.number) + '</b></td><td>' + e(i.client || '—') + '</td><td class="mu">' + e(i.issue) + '</td><td><span class="bd ' + s[1] + '">' + s[0] + '</span>' + (i.exported ? ' <span class="mu">✓ Pohoda</span>' : '') + '</td><td class="r">' + money(calc(i).t) + '</td><td class="r"><button class="g" onclick="togPaid(\'' + i.id + '\')">' + (pd ? 'Nezaplaceno' : 'Zaplaceno') + '</button> <button class="g" onclick="go(\'edit\',\'' + i.id + '\')">Upravit</button> <button class="g" onclick="copyInv(\'' + i.id + '\')">Kopírovat</button> <button class="g d" onclick="delInv(\'' + i.id + '\')">✕</button></td></tr>';
  }).join('');
  return '<div class="card"><div class="row"><h2 class="sp">Faktury – ' + e(C().name) + '</h2><button class="b" onclick="go(\'edit\')">+ Nová faktura</button></div>' +

async function fetchAres(ico) {
  const r = await fetch('https://ares.gov.cz/ekonomicke-subjekty-v-be/rest/ekonomicke-subjekty/' + ico, { headers: { accept: 'application/json' } });
  if (r.status === 404) throw new Error('Subjekt v ARES nenalezen.');
  if (!r.ok) throw new Error('ARES nedostupný');
  const j = await r.json();
  const s = j.sidlo || {};
  const cp = s.cisloDomovni != null ? String(s.cisloDomovni) + (s.cisloOrientacni != null ? '/' + s.cisloOrientacni : '') : '';
  const st = s.nazevUlice || s.nazevCastiObce || s.nazevObce || '';
  const psc = s.psc != null ? String(s.psc).padStart(5, '0').replace(/^(\d{3})(\d{2})$/, '$1 $2') : '';
  const addr = (st && cp && s.nazevObce && psc) ? (st + ' ' + cp + ', ' + psc + ' ' + s.nazevObce) : (s.textovaAdresa || '');
  return { ico: j.ico || ico, name: j.obchodniJmeno || '', dic: j.dic || '', addr };
}

function acct(iban) { iban = String(iban || '').replace(/\s/g, '').toUpperCase(); if (/^CZ\d{22}$/.test(iban)) { const pre = iban.slice(8, 14).replace(/^0+/, ''), no = iban.slice(14).replace(/^0+/, ''); return { no: (pre ? pre + '-' : '') + no, code: iban.slice(4, 8) }; } return null; }
function pohodaXml(list) {
  const c = C(), ac = acct(c.iban);
  let x = '<?xml version="1.0" encoding="UTF-8"?>\n<dat:dataPack id="DOK' + Date.now() + '" ico="' + xe(c.ico) + '" application="Dokladoid" version="2.0" note="Export vydaných faktur" xmlns:dat="http://www.stormware.cz/schema/version_2/data.xsd" xmlns:inv="http://www.stormware.cz/schema/version_2/invoice.xsd" xmlns:typ="http://www.stormware.cz/schema/version_2/type.xsd">\n';
  list.forEach((i, n) => {
    const g = { none: { z: 0, d: 0 }, low: { z: 0, d: 0 }, high: { z: 0, d: 0 } }, ad = addrParse(i.caddr);
    const items = i.items.map(it => {
      const k = it.vat >= 18 ? 'high' : it.vat > 0 ? 'low' : 'none'; g[k].z += it.qty * it.price; g[k].d += it.qty * it.price * it.vat / 100;
      return '<inv:invoiceItem><inv:text>' + xe(String(it.name).slice(0, 90)) + '</inv:text><inv:quantity>' + it.qty + '</inv:quantity><inv:unit>' + xe(it.unit) + '</inv:unit><inv:payVAT>false</inv:payVAT><inv:rateVAT>' + k + '</inv:rateVAT><inv:homeCurrency><typ:unitPrice>' + it.price + '</typ:unitPrice></inv:homeCurrency></inv:invoiceItem>';
    }).join('\n');
    x += '<dat:dataPackItem id="F' + (n + 1) + '" version="2.0"><inv:invoice version="2.0"><inv:invoiceHeader>' +
      '<inv:invoiceType>issuedInvoice</inv:invoiceType><inv:number><typ:numberRequested>' + xe(i.number) + '</typ:numberRequested></inv:number>' +
      '<inv:symVar>' + xe(String(i.vs || i.number).replace(/\D/g, '').slice(0, 20)) + '</inv:symVar><inv:date>' + xe(i.issue) + '</inv:date><inv:dateTax>' + xe(i.issue) + '</inv:dateTax><inv:dateAccounting>' + xe(i.issue) + '</inv:dateAccounting><inv:dateDue>' + xe(i.due) + '</inv:dateDue>' +
      '<inv:text>Fakturujeme Vám</inv:text><inv:paymentType><typ:paymentType>draft</typ:paymentType></inv:paymentType>' +
      (ac ? '<inv:account><typ:accountNo>' + xe(ac.no) + '</typ:accountNo><typ:bankCode>' + ac.code + '</typ:bankCode></inv:account>' : '') +
      '<inv:partnerIdentity><typ:address><typ:company>' + xe(i.client) + '</typ:company><typ:city>' + xe(ad.city) + '</typ:city><typ:street>' + xe(ad.street) + '</typ:street><typ:zip>' + xe(ad.zip) + '</typ:zip><typ:ico>' + xe(i.cico) + '</typ:ico><typ:dic>' + xe(i.cdic) + '</typ:dic></typ:address></inv:partnerIdentity>' +
      '</inv:invoiceHeader><inv:invoiceDetail>\n' + items + '\n</inv:invoiceDetail><inv:invoiceSummary><inv:roundingDocument>none</inv:roundingDocument><inv:homeCurrency>' +
      '<typ:priceNone>' + r2(g.none.z) + '</typ:priceNone><typ:priceLow>' + r2(g.low.z) + '</typ:priceLow><typ:priceLowVAT>' + r2(g.low.d) + '</typ:priceLowVAT><typ:priceLowSum>' + r2(g.low.z + g.low.d) + '</typ:priceLowSum>' +
      '<typ:priceHigh>' + r2(g.high.z) + '</typ:priceHigh><typ:priceHighVAT>' + r2(g.high.d) + '</typ:priceHighVAT><typ:priceHighSum>' + r2(g.high.z + g.high.d) + '</typ:priceHighSum>' +
      '</inv:homeCurrency></inv:invoiceSummary></inv:invoice></dat:dataPackItem>\n';
  });
  return x + '</dat:dataPack>\n';
}

function vSet() {
  const c = C();
  function f(l, k, ph) { return '<div><label>' + l + '</label><input value="' + e(c[k]) + '" placeholder="' + (ph || '') + '" onchange="wrP(\'' + k + '\',this.value);R()"></div>'; }
  return '<div class="card"><h2>Údaje firmy</h2><div class="grid">' + f('Název firmy (s.r.o.)', 'name') + f('IČO', 'ico') + f('DIČ', 'dic') + f('Adresa', 'addr') + f('IBAN pro QR platbu', 'iban', 'CZ65 0800 0000 1920 0014 5399') + f('Číslo účtu', 'bank') + '<div><label>Plátce DPH</label><select onchange="wrP(\'vatPayer\',this.value);R()"><option value="ano"' + (c.vatPayer !== 'ne' ? ' selected' : '') + '>Ano</option><option value="ne"' + (c.vatPayer === 'ne' ? ' selected' : '') + '>Ne</option></select></div></div>' +
    '<p class="mu">Všechna data se ukládají živě do cloudu a vidí je všichni přihlášení uživatelé.</p></div>';
}
